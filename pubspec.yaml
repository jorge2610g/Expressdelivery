name: expressdelivery
description: Aplicación Express Delivery multiplataforma creada con Flutter.
publish_to: "none"
version: 1.6.0+151

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.5.0
  geolocator: 14.0.2
  image_picker: ^1.1.2
  didit_sdk_autodetection: ^4.8.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^20.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0
  shorebird_code_push: ^2.0.7
  terminate_restart: ^1.1.0
  zego_uikit_prebuilt_call: ^4.24.4
  zego_uikit_signaling_plugin: ^2.8.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/branding/express_app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/express_app_icon.png"
  min_sdk_android: 23
