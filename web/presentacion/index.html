 else if(s===10){content+=`<div class="driver-map-cover"><span class="chip green">● VIAJE EN CURSO</span><div class="driver-title">Rumbo al destino</div><p>El pasajero está a bordo con casco.</p></div><div class="driver-sheet"><h3 class="sheet-title">Viaje en progreso</h3>${routeSummary()}<div class="route-item"><span>Importe acordado</span><b>${money(state.driverPrice)}</b></div><button class="full-btn" data-action="advance">Finalizar viaje</button><div class="tiny-note">Simula la llegada de la moto al destino.</div></div>`;}
 else if(s===11){content+=`<div class="driver-map-cover"><span class="chip green">✓ COMPLETADO</span><div class="driver-title">¡Viaje terminado!</div><p>Has llegado al destino.</p></div><div class="driver-sheet"><div class="complete-art">✓</div><div class="waiting"><h3>Viaje completado</h3><p>La experiencia puede continuar<br>con la calificación del pasajero.</p></div><div class="route-item"><span>Importe del servicio</span><b>${money(state.driverPrice)}</b></div><button class="full-btn ghost" data-action="advance">Continuar demostración</button></div>`;}
 else{content+=`<div class="driver-map-cover"><span class="driver-state">● DISPONIBLE</span><div class="driver-title">Listo para más viajes en moto</div><p>El recorrido anterior finalizó.</p></div><div class="driver-sheet"><div class="driver-hero"><div class="car">🏍️</div><strong>Disponible para nuevas solicitudes de moto</strong><p>El mototaxista puede continuar recibiendo viajes.</p></div><div class="route-item"><span>Último viaje</span><b>${money(state.driverPrice)}</b></div><button class="full-btn ghost" data-action="reset">Reiniciar demo</button></div>`;}
 return content+'<div class="home-indicator"></div>';
}
function render(){const d=stages[state.step];$('kicker').textContent=d.eyebrow;$('storyTitle').innerHTML=d.title;$('storyDesc').textContent=d.desc;$('explains').innerHTML=d.points.map(p=>`<div class="explain-item"><div class="check">✓</div><span>${p}</span></div>`).join('');$('hint').innerHTML=`<b>Consejo para presentar:</b> ${d.tip}`;$('storyNext').innerHTML=d.next+' <span>→</span>';$('storyBack').style.display=state.step===0?'none':'';if(!window.__expressFlutterActive){$('passengerScreen').innerHTML=passenger();$('driverScreen').innerHTML=driver();}
 else{syncFlutterPhones();}$('count').textContent=`${String(state.step+1).padStart(2,'0')} / ${String(stages.length).padStart(2,'0')}`;$('progress').innerHTML=stages.map((x,i)=>`<button class="chapter ${i===state.step?'active':''}" data-goto="${i}" title="${x.eyebrow}" aria-label="Ir a ${x.eyebrow}" aria-current="${i===state.step?'step':'false'}"></button>`).join('');$('prevBtn').disabled=state.step===0;$('nextBtn').textContent=state.step===stages.length-1?'Repetir ↻':'Siguiente →';$('resetBtn').innerHTML=ico('reset',16)+' Reiniciar';$('fullscreenBtn').innerHTML=ico('maximize',16)+' Presentar';}
function onAction(action){switch(action){case'advance':next();break;case'back':setStep(state.step-1);break;case'reset':reset();break;case'fare-minus':fareChange(-1);break;case'fare-plus':fareChange(1);break;case'driver-minus':fareChange(-1,true);break;case'driver-plus':fareChange(1,true);break;case'cancel':showCancel();break;case'validate':validatePin();break;case'ack':state.arrivalAck=true;render();toast('Aviso de “Ya voy” enviado (simulación)');break;case'decline':modal('Solicitud rechazada','El conductor puede rechazar una oportunidad. Para seguir la presentación, conserva esta solicitud de demostración.','Volver a la búsqueda',()=>setStep(4),'🚫');break;case'chat':modal('Chat del viaje','Ejemplo: “Hola, estoy junto al acceso principal.” El chat del servicio permite comunicarse sin salir de la app. Ningún mensaje se envía realmente.','Entendido',null,'💬');break;case'call':modal('Llamada privada','Express contempla comunicación durante el servicio. La disponibilidad de llamadas depende de su configuración e integración. Esta demostración no inicia ninguna llamada.','Entendido',null,'📞');break;case'share':modal('Compartir viaje','Express puede generar un enlace temporal de seguimiento para un contacto de confianza durante un viaje activo, cuando esta función está habilitada. Aquí solo lo mostramos como ejemplo.','Entendido',null,'🔗');break;case'sos':modal('Herramientas de seguridad','Express incluye controles de seguridad y SOS dentro de un viaje activo. Este botón es ilustrativo; no activa una emergencia ni notifica a ninguna persona.','Entendido',null,'🛡️');break;case'pin-tip':modal('¿Por qué el PIN?','El PIN verifica que el pasajero está con el mototaxista correcto. No lo compartas antes de confirmar la moto y su placa; usa casco antes de iniciar.','Entendido',null,'🔒');break;case'menu':modal('Menú del pasajero','En Express puedes acceder a historial, pagos y movimientos, lugares guardados, seguridad, soporte y perfil. Esta demo se concentra en el flujo del viaje.','Entendido',null,'☰');break;case'locate':toast('Ubicación de demostración: Trinidad, Bolivia');break;default:break}}
document.body.addEventListener('click',e=>{const rating=e.target.closest('[data-rating]');if(rating){state.rating=Number(rating.dataset.rating);render();return}const dest=e.target.closest('[data-dest]');if(dest){setDestination(dest.dataset.dest);return}const goto=e.target.closest('[data-goto]');if(goto){setStep(Number(goto.dataset.goto));return}const action=e.target.closest('[data-action]');if(action)onAction(action.dataset.action)});
const focusButton=$('focusBtn');
function applyTabletFocus(enabled){
  document.body.classList.toggle('tablet-focus',enabled);
  focusButton.setAttribute('aria-pressed',String(enabled));
  focusButton.textContent=enabled?'▣ Mostrar explicación':'▣ Ampliar teléfonos';
  focusButton.title=enabled?'Mostrar explicación y dos teléfonos':'Ampliar los dos teléfonos';
}
focusButton.addEventListener('click',()=>applyTabletFocus(!document.body.classList.contains('tablet-focus')));
$('storyNext').onclick=next;$('storyBack').onclick=()=>setStep(state.step-1);$('nextBtn').onclick=next;$('prevBtn').onclick=()=>setStep(state.step-1);$('resetBtn').onclick=reset;
$('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().then(()=>{document.body.classList.add('presenter-mode');$('fullscreenBtn').innerHTML=ico('minimize',16)+' Salir';}).catch(()=>toast('Tu navegador no permitió pantalla completa.'))}else{document.exitFullscreen?.()}};
document.addEventListener('fullscreenchange',()=>{const yes=!!document.fullscreenElement;document.body.classList.toggle('presenter-mode',yes);$('fullscreenBtn').innerHTML=ico(yes?'minimize':'maximize',16)+(yes?' Salir':' Presentar')});
document.addEventListener('input',e=>{if(e.target?.id==='pinInput')state.pin=e.target.value.replace(/\D/g,'').slice(0,4)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show')){closeModal();return}if(e.target.matches('input,textarea,select')||$('overlay').classList.contains('show')){if(e.key==='Enter'&&e.target.id==='pinInput')validatePin();return}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setStep(state.step-1)}if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey){reset()}if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey){$('fullscreenBtn').click()}});


// The actual Flutter Web presentation bundles below render real widgets imported
// from lib/video_style_home.dart. They never initialize Supabase or create trips.
window.__expressFlutterActive=false;
window.__expressReadyRoles=new Set();
function syncFlutterPhones(){
  for(const frame of document.querySelectorAll('iframe.official-frame')){
    const dest=frame.contentWindow;
    if(!dest)continue;
    dest.postMessage(JSON.stringify({source:'express-moto-parent',step:state.step,fare:state.fare,
      origin:state.pickup,destination:state.destination}),location.origin);
  }
}
window.addEventListener('message',(event)=>{
  let payload=event.data;
  if(typeof payload==='string'){try{payload=JSON.parse(payload)}catch(_){return}}
  if(event.origin!==location.origin||payload?.source!=='express-moto-flutter')return;
  if(!window.__expressFlutterActive)return;
  const a=String(payload.action||'');
  if(a==='ready'){
    if(payload.role==='pasajero'||payload.role==='conductor')window.__expressReadyRoles.add(payload.role);
    if(window.__expressReadyRoles.size===2){$('officialModeTag').textContent='✓ DOS APPS FLUTTER OFICIALES';}
    syncFlutterPhones();return;
  }
  if(a.startsWith('destination:')){setDestination(a.slice('destination:'.length));return;}
  if(a.startsWith('fare:')){
    const fare=Number(a.slice(5));
    if(Number.isFinite(fare)&&fare>=5&&fare<=120){state.fare=fare;state.driverPrice=fare;render();}
    return;
  }
  if(a.startsWith('info:')){
    const what=a.slice(5);
    const content={navegación:'Mapa y ruta del servicio; recorrido ilustrativo.',waze:'El conductor puede abrir Waze desde la app original.',
      llamada:'La llamada real no está habilitada en esta demostración.',
      chat:'El chat real no está habilitado en esta demostración.',
      compartir:'El seguimiento compartido es una función de los viajes activos reales.',
      seguridad:'El sistema SOS real está desactivado para proteger la presentación.',
      'ya voy':'El aviso Ya voy se ha simulado correctamente.',
      'ignorar oferta':'Esta es una oferta ficticia: continúa para enseñar el siguiente paso.'}[what]||'Esta función se muestra sin conectar con viajes reales.';
    modal('Express Moto · '+what,content,'Continuar',null,'ℹ️');return;
  }
  onAction(a);
});
async function activarFlutterOriginal(){
  if(location.protocol==='file:')return; // Local/offline fallback is the static demo.
  try{
    const response=await fetch('./flutter/flutter_bootstrap.js',{cache:'no-store',method:'HEAD'});
    if(!response.ok){$('officialModeTag').textContent='⚠ Demo HTML: paquete Flutter sin publicar';return;}
    window.__expressFlutterActive=true;
    const passengerScreen=$('passengerScreen');
    const driverScreen=$('driverScreen');
    passengerScreen.innerHTML='<iframe class="official-frame" title="Interfaz Flutter oficial de pasajero" src="./flutter/?role=pasajero" allow="fullscreen"></iframe>';
    driverScreen.innerHTML='<iframe class="official-frame" title="Interfaz Flutter oficial de mototaxista" src="./flutter/?role=conductor" allow="fullscreen"></iframe>';
    $('officialModeTag').textContent='Cargando dos apps Flutter…';
    for(const f of document.querySelectorAll('iframe.official-frame'))f.addEventListener('load',syncFlutterPhones);
    syncFlutterPhones();
  }catch(_){$('officialModeTag').textContent='⚠ Demo HTML: Flutter no disponible';}
}
activarFlutterOriginal();

// Los cambios publicados en contenido.json se ven siempre en esta misma URL.
async function cargarContenidoOnline(){
  try {
    const response=await fetch('./contenido.json?v='+Date.now(), {cache:'no-store'});
    if(!response.ok) return;
    const data=await response.json();
    if(data.escenario && typeof data.escenario==='object'){
      const e=data.escenario;
      if(typeof e.origen==='string')state.pickup=e.origen;
      if(typeof e.destino==='string')state.destination=e.destino;
      if(Number.isFinite(e.precio_bob)&&e.precio_bob>=5&&e.precio_bob<=120){demoConfig.fare=e.precio_bob;state.fare=e.precio_bob;state.driverPrice=e.precio_bob;}
    }
    if(Array.isArray(data.etapas)){
      data.etapas.forEach((etapa,i)=>{
        if(!stages[i]||!etapa||typeof etapa!=='object')return;
        for(const [clave,dest] of [['seccion','eyebrow'],['titulo','title'],['descripcion','desc'],['consejo','tip'],['boton','next']]){
          if(typeof etapa[clave]==='string' && etapa[clave].length<450)stages[i][dest]=etapa[clave];
        }
        if(Array.isArray(etapa.puntos)&&etapa.puntos.length<=5&&etapa.puntos.every(p=>typeof p==='string'))stages[i].points=etapa.puntos;
      });
    }
    render();
  }catch(_error){/* En modo archivo local la presentación funciona con sus textos incorporados. */}
}
render();cargarContenidoOnline();
