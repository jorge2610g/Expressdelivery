<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b57d0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Express</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px;
      font: 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
      background: linear-gradient(145deg,#03246e,#0765d2); color: white; }
    main { width: min(100%,460px); background: #ffffff14; border: 1px solid #ffffff50;
      border-radius: 24px; padding: 30px 24px; text-align: center; box-shadow: 0 18px 45px #0004; }
    h1 { margin: 0 0 8px; font-size: 38px; line-height: 1.1; }
    p { margin: 6px 0 4px; }
    .spinner { width: 28px; height: 28px; margin: 14px auto 4px; border-radius: 50%;
      border: 3px solid #ffffff40; border-top-color: white; animation: spin .8s linear infinite; }
    .spinner[hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .links { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .links[hidden] { display: none; }
    a { padding: 14px; border-radius: 11px; text-decoration: none; background: white;
      color: #063586; font-weight: 800; }
    a[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Express</h1>
    <p id="message" role="status">Abriendo Express…</p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <div id="links" class="links" hidden>
      <a id="android" href="https://play.google.com/store/apps/details?id=com.express.usuario1" hidden>Abrir en Google Play</a>
      <a id="ios" href="#" hidden>Abrir en la App Store</a>
      <a id="web" href="https://expressviajes.online/" hidden>Abrir Express en la web</a>
    </div>
  </main>
  <script>
    (async function () {
      'use strict';
      const base = 'https://zgpijrznvaskgcmauwxx.supabase.co';
      const key = 'sb_publishable_MALGs-X8KdmJSq-QQzeazQ_p5xsfrZP';
      // Enlaces de seguridad: se usan solo si la configuración no responde.
      const defaults = {
        android: { url: 'https://play.google.com/store/apps/details?id=com.express.usuario1', enabled: true },
        ios: { url: '', enabled: false },
        web: { url: 'https://expressviajes.online/', enabled: true }
      };
      const message = document.getElementById('message');
      const spinner = document.getElementById('spinner');
      const linksBox = document.getElementById('links');
      const preview = new URLSearchParams(location.search).has('preview');

      // 1) El dispositivo se decide de inmediato, sin esperar a la red.
      const agent = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(agent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(agent);
      const platform = isAndroid ? 'android' : isIOS ? 'ios' : 'web';

      const isSafeUrl = value => {
        try {
          const parsed = new URL(value);
          return parsed.protocol === 'https:' && Boolean(parsed.hostname);
        } catch (_) { return false; }
      };

      // 2) Enlaces configurados en el administrador (espera máxima 3 s).
      let links = JSON.parse(JSON.stringify(defaults));
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      try {
        const response = await fetch(
          base + '/rest/v1/app_download_links?select=platform,url,enabled',
          { headers: { apikey: key, Accept: 'application/json' },
            cache: 'no-store', signal: controller.signal }
        );
        if (response.ok) {
          const rows = await response.json();
          if (Array.isArray(rows)) {
            for (const row of rows) {
              if (Object.hasOwn(defaults, row.platform)) {
                links[row.platform] = { url: row.url || '', enabled: row.enabled === true };
              }
            }
          }
        }
      } catch (_) {
        // Sin conexión a la configuración: Android y web conservan sus enlaces seguros.
      } finally {
        clearTimeout(timeout);
      }

      const usable = name => links[name].enabled && isSafeUrl(links[name].url);
      const show = names => {
        for (const name of names) {
          const element = document.getElementById(name);
          element.href = links[name].url;
          element.hidden = false;
        }
        linksBox.hidden = false;
      };

      // Vista de prueba para el administrador: muestra todos los accesos.
      if (preview) {
        spinner.hidden = true;
        message.textContent = 'Vista de prueba: sin redirección automática.';
        show(['android', 'ios', 'web'].filter(usable));
        return;
      }

      // 3) iPhone sin enlace activo: solo el aviso, sin botones.
      if (!usable(platform)) {
        spinner.hidden = true;
        message.textContent = platform === 'ios'
          ? 'La versión para iPhone todavía no está disponible.'
          : 'Este enlace no está disponible por ahora.';
        return;
      }

      // 4) Redirección automática al destino del dispositivo.
      location.replace(links[platform].url);

      // Si el navegador incrustado no deja salir (por ejemplo, al escanear con
      // otra app), a los 4 s aparece un único botón para este dispositivo.
      setTimeout(() => {
        spinner.hidden = true;
        message.textContent = 'Si no se abrió automáticamente, toca el botón.';
        show([platform]);
      }, 4000);
    })();
  </script>
</body>
</html>
