  <script>
    (async function () {
      const resetKey = 'express-cache-reset-v1.5.0-build37';
      let cleaned = false;

      try {
        if (sessionStorage.getItem(resetKey) !== 'done') {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              const removed = await registration.unregister();
              cleaned = cleaned || removed;
            }
          }

          if ('caches' in window) {
            const keys = await caches.keys();
            for (const key of keys) {
              const removed = await caches.delete(key);
              cleaned = cleaned || removed;
            }
          }

          sessionStorage.setItem(resetKey, 'done');
        }
      } catch (_) {}

      if (cleaned) {
        const url = new URL(window.location.href);
        url.searchParams.set(
          '_express_cache',
          '1.5.0-37-' + Date.now().toString()
        );
        window.location.replace(url.toString());
        return;
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=1.5.0-build37-' + Date.now().toString();
      script.async = true;
      document.body.appendChild(script);
    })();
