appId: com.express.usuario1
name: Express Production startup smoke
tags:
  - smoke
  - production
  - startup
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- tapOn:
    text: "Mientras usas la app"
    optional: true
- extendedWaitUntil:
    visible: "Correo electrónico"
    timeout: 35000
- assertVisible: "Correo electrónico"
- assertVisible: "Contraseña"
- assertVisible: "Ingresar"
- assertNotVisible: "Express no pudo iniciar"
- assertNotVisible: "E-START-AUTH"
- takeScreenshot: production-startup-login
