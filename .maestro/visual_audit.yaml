appId: com.express.usuario.preview
name: Express Preview visual AI audit
tags:
  - visual-ai
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Permitir"
    optional: true
- assertNoDefectsWithAI:
    optional: false
- assertWithAI:
    assertion: "La pantalla visible de Express se ve profesional: no hay textos cortados, tarjetas superpuestas, botones fuera de margen, huecos blancos anormales ni iconos desalineados."
    optional: false
- takeScreenshot: visual-ai-current-screen
