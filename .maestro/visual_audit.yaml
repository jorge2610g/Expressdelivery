appId: com.express.usuario.preview
name: Express Preview visual AI audit
tags:
  - visual-ai
---
- launchApp
- extendedWaitUntil:
    visible: "Correo electrónico"
    timeout: 20000
- assertNoDefectsWithAI:
    optional: false
- assertWithAI:
    assertion: "La pantalla de Express se ve profesional: no hay textos cortados, tarjetas superpuestas, botones fuera de margen, huecos blancos anormales ni iconos desalineados."
    optional: false
- takeScreenshot: visual-ai-login
