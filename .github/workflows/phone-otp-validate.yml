name: Validate Phone OTP

on:
  pull_request:
    paths:
      - 'lib/phone_verification_page.dart'
      - 'lib/services/express_service.dart'
      - 'pubspec.yaml'
      - 'supabase/functions/phone-otp/**'
      - 'supabase/migrations/121_phone_otp_multi_provider_router.sql'
      - 'supabase/migrations/122_phone_otp_rolling_24h_quota.sql'
      - '.github/workflows/phone-otp-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze phone OTP integration
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/phone_verification_page.dart \
            lib/services/express_service.dart \
            lib/push_notifications_native.dart
      - name: Verify OTP migration is present
        run: |
          grep -q "reserve_phone_otp_daily_slot" supabase/migrations/121_phone_otp_multi_provider_router.sql
          grep -q "phone_otp_challenges" supabase/migrations/121_phone_otp_multi_provider_router.sql
          grep -q "pg_advisory_xact_lock" supabase/migrations/122_phone_otp_rolling_24h_quota.sql
          grep -q "24 hours" supabase/migrations/122_phone_otp_rolling_24h_quota.sql
      - name: Verify provider secrets stay server-side
        run: |
          ! grep -R "LETEL_API_KEY\|UNIMTX_ACCESS_KEY_SECRET\|PHONE_OTP_PEPPER" lib/
