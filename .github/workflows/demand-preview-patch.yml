name: Express Demand Branch Validate

on:
  push:
    branches:
      - feature/demand-pricing-preview
    paths:
      - '.github/workflows/demand-preview-patch.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: express-demand-branch-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Feature SHA validated: $GITHUB_SHA"
          echo "This workflow validates only. It is not allowed to publish Shorebird patches."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate feature code
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/video_style_home.dart \
            lib/location_picker.dart \
            lib/services/express_service.dart \
            lib/driver_subscription_page.dart \
            lib/connected_experience.dart \
            lib/express_account_pages.dart \
            lib/push_notifications_native.dart
          flutter build web --release \
            --target lib/web_preview.dart \
            --base-href /Expressdelivery/ \
            --dart-define="EXPRESS_PREVIEW_MODE=true"
