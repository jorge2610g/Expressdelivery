name: Validate release gate infrastructure

on:
  push:
    branches:
      - infra/manual-preview-production-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate workflow source pinning
        run: |
          grep -q "Checkout exact build source" .github/workflows/build-android.yml
          grep -q "source_sha" .github/workflows/build-android.yml
          if grep -A20 "^on:" .github/workflows/shorebird-preview-codepush.yml | grep -q "push:"; then
            echo "Preview workflow still has automatic push trigger"
            exit 1
          fi
      - name: Validate migrations present
        run: test -f supabase/migrations/064_preview_production_release_gate.sql
