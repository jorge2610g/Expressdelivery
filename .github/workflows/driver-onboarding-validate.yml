name: Validate Driver Onboarding

on:
  push:
    branches:
      - feature/driver-onboarding-documents
  pull_request:
    paths:
      - 'lib/driver_setup.dart'
      - 'lib/services/express_service.dart'
      - 'lib/connected_experience.dart'
      - 'lib/express_account_pages.dart'
      - 'supabase/migrations/099_driver_onboarding_documents.sql'
      - 'supabase/migrations/100_driver_onboarding_security_hardening.sql'
      - 'supabase/migrations/101_driver_onboarding_rls_hardening.sql'
      - '.github/workflows/driver-onboarding-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze driver onboarding
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos             lib/driver_setup.dart             lib/services/express_service.dart             lib/connected_experience.dart
      - name: Build web smoke test
        run: |
          flutter build web --release             --target lib/web_preview.dart             --base-href /Expressdelivery/

