name: Validate passenger GPS reset

on:
  push:
    branches:
      - fix/passenger-pickup-gps-reset
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/video_style_home.dart lib/location_picker.dart lib/mobile_main.dart
