name: Express 142 - Play Internal QA

on:
  push:
    branches:
      - work/express-single-app-1.6.3-build142
    paths:
      - .github/play-internal/request.json
  workflow_dispatch:
    inputs:
      mode:
        description: Check Play access or publish only to the internal test track
        required: true
        type: choice
        options:
          - check
          - publish
      release_tag:
        description: Immutable signed build 142 GitHub Release tag
        required: true
        type: string
      confirmation:
        description: For publish, type AUTORIZO PRUEBAS INTERNAS
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: express-142-play-internal
  cancel-in-progress: false

jobs:
  contracts:
    name: Check internal publisher safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test identity validation and internal track selection
        run: python3 scripts/play_internal.py --self-test

  publish:
    name: Verify or upload to internal testing only
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read and guard explicit request
        id: request
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test -s .github/play-internal/request.json
            MODE="$(jq -er '.mode' .github/play-internal/request.json)"
            TAG="$(jq -er '.release_tag' .github/play-internal/request.json)"
            CONFIRM="$(jq -r '.confirmation // ""' .github/play-internal/request.json)"
          else
            MODE="$INPUT_MODE"
            TAG="$INPUT_TAG"
            CONFIRM="$INPUT_CONFIRM"
          fi
          [[ "$MODE" == check || "$MODE" == publish ]]
          [[ "$TAG" =~ ^single-app-android-qa-v1\.6\.3-build142-sha[0-9a-f]{12}-job[0-9a-f]{8}$ ]]
          if [ "$MODE" = publish ] && [ "$CONFIRM" != 'AUTORIZO PRUEBAS INTERNAS' ]; then
            echo "::error::Falta autorización explícita para publicar en pruebas internas."
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "confirm=$CONFIRM" >> "$GITHUB_OUTPUT"
          echo "Destino permitido: com.express.usuario1 / pista qa o internal."
      - name: Fetch the exact signed APK, AAB and identity from GitHub Release
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
          mkdir -p dist
          gh release download "$TAG" \
            --pattern 'express-single-app-candidate-v1.6.3-build142.apk' \
            --pattern 'express-single-app-candidate-v1.6.3-build142.aab' \
            --pattern 'express-single-app-candidate-v1.6.3-build142-identity.json' \
            --dir dist
          test -s dist/express-single-app-candidate-v1.6.3-build142.apk
          test -s dist/express-single-app-candidate-v1.6.3-build142.aab
          test -s dist/express-single-app-candidate-v1.6.3-build142-identity.json
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Install pinned Google Play API libraries
        run: python3 -m pip install --disable-pip-version-check --quiet 'google-auth==2.38.0' 'requests==2.32.3'
      - name: Check Play or publish only to internal track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ steps.request.outputs.mode }}
          TAG: ${{ steps.request.outputs.tag }}
          TAG_COMMIT: ${{ steps.candidate.outputs.tag_commit }}
          CONFIRM: ${{ steps.request.outputs.confirm }}
        run: |
          set -euo pipefail
          python3 scripts/play_internal.py \
            --mode "$MODE" \
            --release-tag "$TAG" \
            --tag-commit "$TAG_COMMIT" \
            --identity dist/express-single-app-candidate-v1.6.3-build142-identity.json \
            --apk dist/express-single-app-candidate-v1.6.3-build142.apk \
            --aab dist/express-single-app-candidate-v1.6.3-build142.aab \
            --confirmation "$CONFIRM"
