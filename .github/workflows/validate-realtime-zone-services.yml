name: Validate realtime zone services

on:
  push:
    branches:
      - feat/realtime-zone-service-visibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/video_style_home.dart lib/services/express_service.dart lib/mobile_main.dart
