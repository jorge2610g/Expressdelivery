name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 1 && github.event.comment.body == '/deploy-pages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Mapbox web token
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$MAPBOX_PUBLIC_TOKEN" != pk.* ]]; then
            echo "::error::MAPBOX_PUBLIC_TOKEN is missing or invalid."
            exit 1
          fi

      - name: Analyze production-critical Flutter
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/web_preview.dart \
            lib/connected_experience.dart \
            lib/video_style_home.dart \
            lib/services/express_service.dart

      - name: Run Flutter regression tests
        run: flutter test

      - name: Restore official Express icon
        run: python3 .github/scripts/restore_branding_asset.py

      - name: Build Flutter Web
        shell: bash
        run: |
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"

          flutter build web --release \
            --target lib/web_preview.dart \
            --base-href / \
            --dart-define="EXPRESS_PACKAGE_VERSION=${RAW_VERSION}" \
            --dart-define="EXPRESS_DISPLAY_VERSION=Express v${VERSION_NAME} · build ${BUILD_NUMBER}" \
            --dart-define="MAPBOX_PUBLIC_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }}"

      - name: Publish Play policy pages
        shell: bash
        run: |
          set -euo pipefail
          cp web/privacy.html build/web/privacy.html
          cp web/delete-account.html build/web/delete-account.html
          cp web/terms.html build/web/terms.html
          cp web/app-ads.txt build/web/app-ads.txt

          mkdir -p build/web/privacidad build/web/terminos build/web/eliminar-cuenta
          cp web/privacy.html build/web/privacidad/index.html
          cp web/terms.html build/web/terminos/index.html
          cp web/delete-account.html build/web/eliminar-cuenta/index.html

      - name: Version Flutter executable
        shell: bash
        run: |
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          SAFE_VERSION="$(echo "$RAW_VERSION" | tr '+.' '--')"
          # The package version may remain 1.6.1+169 during dozens of Web UI
          # updates. A stable JS filename can leave GitHub Pages / browsers
          # displaying a previously cached app even after a successful deploy.
          # The source commit is immutable, so each revision gets a new URL.
          SOURCE_SHA="$(git rev-parse --short=12 HEAD)"
          VERSIONED_MAIN="main.$SAFE_VERSION.$SOURCE_SHA.dart.js"
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          cp build/web/main.dart.js "build/web/$VERSIONED_MAIN"

          # Fail the build rather than silently publishing a bootstrap which
          # points at the previous revision. web/index.html already gives the
          # bootstrap a fresh cache-busting query on each navigation.
          if ! grep -q "main.dart.js" build/web/flutter_bootstrap.js; then
            echo "::error::Flutter bootstrap does not reference main.dart.js"
            exit 1
          fi
          sed -i "s|main.dart.js|$VERSIONED_MAIN|g" build/web/flutter_bootstrap.js
          grep -Fq "$VERSIONED_MAIN" build/web/flutter_bootstrap.js
          echo "Deploying immutable Flutter bundle: $VERSIONED_MAIN"

          rm -f build/web/flutter_service_worker.js
          cp web/express_push_sw.js build/web/express_push_sw.js

      - name: Write deployed version marker
        shell: bash
        run: |
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER="${RAW_VERSION##*+}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"

          cat > build/web/version.json <<EOF
          {
            "app_name": "Express",
            "package_name": "com.express.delivery.web",
            "package": "${RAW_VERSION}",
            "version": "${VERSION_NAME}",
            "build": "${BUILD_NUMBER}",
            "build_number": "${BUILD_NUMBER}",
            "display": "Express v${VERSION_NAME} · build ${BUILD_NUMBER}",
            "commit": "${SOURCE_COMMIT}",
            "deployed_at": "${DEPLOYED_AT}"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 1 && github.event.comment.body == '/deploy-pages')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
