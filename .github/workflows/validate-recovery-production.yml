name: Validate recovery production release

on:
  push:
    branches:
      - release/recovery-to-production-1.5.80
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/connected_experience.dart lib/driver_subscription_page.dart lib/express_account_pages.dart lib/location_picker.dart lib/services/express_service.dart lib/video_style_home.dart lib/mobile_main.dart
