name: Validate Floating Driver Offers

on:
  pull_request:
    paths:
      - 'lib/floating_driver_offer.dart'
      - 'lib/push_notifications_native.dart'
      - 'lib/video_style_home.dart'
      - 'lib/mobile_main.dart'
      - 'lib/preview_main.dart'
      - 'pubspec.yaml'
      - '.github/scripts/prepare_android_branding.py'
      - 'supabase/migrations/*floating_offer*.sql'
      - '.github/workflows/floating-offer-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze floating offer integration
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/floating_driver_offer.dart \
            lib/push_notifications_native.dart \
            lib/video_style_home.dart \
            lib/mobile_main.dart \
            lib/preview_main.dart
      - name: Verify Android overlay contract
        run: |
          python .github/scripts/prepare_android_branding.py com.express.usuario.preview "Express Preview"
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -q 'flutter.overlay.window.flutter_overlay_window.OverlayService' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="specialUse"' android/app/src/main/AndroidManifest.xml
      - name: Verify Preview only enables APK release artifact
        run: |
          grep -q '^version: 1.6.0+155$' pubspec.yaml
          grep -q "driver_floating_offer_enabled" supabase/migrations/20261006095823_driver_floating_offer_preview155.sql
