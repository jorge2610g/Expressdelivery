name: Resolve Preview SHA Fingerprints

on:
  push:
    branches:
      - feature/phone-otp-router
    paths:
      - '.github/workflows/preview-sha-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch stable Android signing certificate
        shell: bash
        env:
          WORKER_URL: https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/android-build-worker
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker"             | jq -r .value)"
          RESPONSE="$(curl -fsS -X POST "$WORKER_URL"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data '{"action":"signing"}')"

          MODE="$(jq -r '.mode' <<<"$RESPONSE")"
          ALIAS="$(jq -r '.alias' <<<"$RESPONSE")"
          STORE_PASSWORD="$(jq -r '.store_password' <<<"$RESPONSE")"
          DOWNLOAD_URL="$(jq -r '.download_url' <<<"$RESPONSE")"

          test "$MODE" = "existing"
          test -n "$ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$DOWNLOAD_URL"

          echo "::add-mask::$STORE_PASSWORD"
          curl -fsSL "$DOWNLOAD_URL" -o /tmp/express-preview-signing.jks

          keytool -list -v             -keystore /tmp/express-preview-signing.jks             -storepass "$STORE_PASSWORD"             -alias "$ALIAS"             | grep -E 'SHA1:|SHA256:'
