name: Validate Regression Recovery

on:
  push:
    branches:
      - repair/recover-7c16ea41-with-current-main
      - fix/audit-production-readiness-20261007
      - fix/first-launch-total-timeout-20261007
      - fix/location-security-hardening-20261007
      - fix/gps-shorebird-repair-20261007
      - fix/trip-ui-push-dedup-20261007
      - fix/startup-critical-permissions-20261007
      - feat/mapbox-primary-fallback-20261007
      - feat/mapbox-quota-guard-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze recovered app
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/video_style_home.dart \
            lib/services/express_service.dart \
            lib/driver_subscription_page.dart \
            lib/connected_experience.dart \
            lib/express_account_pages.dart \
            lib/push_notifications_native.dart \
            lib/location_service.dart \
            lib/app_error_reporter.dart \
            lib/map_provider.dart \
            lib/mobile_main.dart \
            lib/location_picker.dart \
            lib/service_tracking.dart \
            lib/express_delivery_v2_page.dart

      - name: Verify Mapbox public token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [[ ! "$MAPBOX_PUBLIC_TOKEN" =~ ^pk\. ]]; then
            echo "::error::MAPBOX_PUBLIC_TOKEN is missing or is not a public pk.* token"
            exit 1
          fi
          echo "Mapbox public token is configured."

      - name: Run Flutter regression tests
        run: flutter test

      - name: Verify dynamic pricing channel isolation migration
        run: |
          test -f supabase/migrations/20261007052000_dynamic_pricing_channel_isolation.sql
          grep -q "dynamic_pricing_channel_settings" supabase/migrations/20261007052000_dynamic_pricing_channel_isolation.sql
          grep -q "where channel=v_channel" supabase/migrations/20261007052000_dynamic_pricing_channel_isolation.sql

      - name: Verify location privacy hardening migration
        run: |
          test -f supabase/migrations/20261007060000_location_privacy_hardening.sql
          grep -q "location_updated_at" supabase/migrations/20261007060000_location_privacy_hardening.sql
          grep -q "driver_profile_for_viewer" supabase/migrations/20261007060000_location_privacy_hardening.sql
          grep -q "round(dp.latitude::numeric,3)" supabase/migrations/20261007060000_location_privacy_hardening.sql

      - name: Verify Mapbox quota guard migration
        run: |
          test -f supabase/migrations/20261007121500_mapbox_quota_guard.sql
          test -f supabase/migrations/20261007121600_mapbox_quota_admin_fix.sql
          grep -q "directions_limit bigint not null default 100000" supabase/migrations/20261007121500_mapbox_quota_guard.sql
          grep -q "static_tiles_limit bigint not null default 200000" supabase/migrations/20261007121500_mapbox_quota_guard.sql
          grep -q "fallback_ratio numeric(5,4) not null default 0.9000" supabase/migrations/20261007121500_mapbox_quota_guard.sql
          grep -q "record_mapbox_usage" supabase/migrations/20261007121500_mapbox_quota_guard.sql
          grep -q "mapbox_quota_state" supabase/migrations/20261007121500_mapbox_quota_guard.sql

      - name: Build web smoke test
        run: |
          flutter build web --release \
            --target lib/web_preview.dart \
            --base-href /Expressdelivery/ \
            --dart-define="MAPBOX_PUBLIC_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }}"
