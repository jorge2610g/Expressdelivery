name: Verify ZEGOCLOUD Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - feature/private-voice-calls
    paths:
      - '.github/workflows/zego-secrets-health.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check ZEGOCLOUD environment
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/zego-health-check)"
          echo "$RESPONSE" | jq '{ok,appIdPresent,appIdValid,serverSecretPresent,serverSecretLengthValid,cryptoReady}'
          test "$(echo "$RESPONSE" | jq -r '.ok')" = "true"
