name: One-shot retire merged Preview experiment branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retire-preview-experiment-refs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'jorge2610g/Expressdelivery' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Retire only three fully merged historical experiment refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            'experiment/live-preview-mirror' \
            'refactor/unified-android-release-20261006' \
            'workflow/web-preview-primary-20261007'; do
            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
              echo "Already absent: $branch"
              continue
            fi
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "$GITHUB_SHA"; then
              echo "::error::Ref $branch has unmerged work, refusing deletion."
              exit 1
            fi
            echo "Verified $branch contains no commits outside main."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Retired merged ref $branch"
          done
          echo "No backup/*, feature/* or release/* refs were deleted."
