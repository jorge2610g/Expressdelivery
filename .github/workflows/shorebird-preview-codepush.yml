name: Express Preview Shorebird Code Push

on:
  workflow_dispatch:
    inputs:
      mode:
        description: release crea una nueva base; patch publica un cambio Dart
        required: true
        default: patch
        type: choice
        options:
          - patch
          - release
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'shorebird.yaml'
      - 'assets/**'
      - '.github/scripts/prepare_android_branding.py'
      - '.github/scripts/restore_branding_asset.py'
      - '.github/recovery/preview-release-recovery.json'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: express-preview-shorebird
  cancel-in-progress: true

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  SUPABASE_URL: https://zgpijrznvaskgcmauwxx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_MALGs-X8KdmJSq-QQzeazQ_p5xsfrZP
  WORKER_URL: https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/android-build-worker

jobs:
  codepush:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[recover-preview]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Resolve Preview version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [[ ! "$PACKAGE_VERSION" =~ ^[^+]+\+[0-9]+$ ]]; then
            echo "Versión Flutter inválida en pubspec.yaml: $PACKAGE_VERSION"
            exit 1
          fi
          PREVIEW_VERSION_NAME="${PACKAGE_VERSION%%+*}"
          PREVIEW_BUILD_NUMBER="${PACKAGE_VERSION##*+}"
          PREVIEW_RELEASE_VERSION="$PACKAGE_VERSION"
          echo "PREVIEW_VERSION_NAME=$PREVIEW_VERSION_NAME" >> "$GITHUB_ENV"
          echo "PREVIEW_BUILD_NUMBER=$PREVIEW_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "PREVIEW_RELEASE_VERSION=$PREVIEW_RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "Express Preview version: $PREVIEW_RELEASE_VERSION"

      - name: Determine release or patch
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            TAG="preview-shorebird-v${PREVIEW_VERSION_NAME}-build${PREVIEW_BUILD_NUMBER}"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              MODE="patch"
              echo "Existing Shorebird base found for $PREVIEW_RELEASE_VERSION; publishing patch."
            else
              BEFORE="${{ github.event.before }}"
              MODE="release"
              if [ -n "$BEFORE" ] &&
                 [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                git fetch --no-tags origin "$BEFORE" --depth=1
                BEFORE_VERSION="$(git show "$BEFORE:pubspec.yaml" | awk '/^version:/ {print $2; exit}')"
                echo "Previous Preview version: $BEFORE_VERSION"
              fi
              echo "No Shorebird base exists for $PREVIEW_RELEASE_VERSION; creating release."
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Express Preview Shorebird mode: $MODE"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore official Express icon
        run: python3 .github/scripts/restore_branding_asset.py

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Validate shared Flutter code
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/video_style_home.dart \
            lib/express_marketplace_page.dart \
            lib/driver_priority_page.dart \
            lib/services/express_service.dart \
            lib/push_notifications_native.dart
          flutter build web --release \
            --target lib/web_preview.dart \
            --base-href /Expressdelivery/ \
            --dart-define="EXPRESS_PACKAGE_VERSION=$PREVIEW_RELEASE_VERSION" \
            --dart-define="EXPRESS_DISPLAY_VERSION=Express Preview $PREVIEW_RELEASE_VERSION"

      - name: Patch Android plugin Gradle compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = sorted(
              list(Path.home().glob('.pub-cache/hosted/pub.dev/*/android/build.gradle')) +
              list(Path.home().glob('.pub-cache/hosted/pub.dev/*/android/build.gradle.kts'))
          )
          if not matches:
              raise SystemExit('Android plugin Gradle files not found in pub cache')

          changed = 0
          for plugin_gradle in matches:
              source = plugin_gradle.read_text()
              patched = source.replace('jcenter()', 'mavenCentral()')
              if plugin_gradle.suffix == '.kts':
                  patched = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', patched)
                  patched = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', patched)
              else:
                  patched = re.sub(r'compileSdkVersion\s*(?:=)?\s*\d+', 'compileSdkVersion 36', patched)
                  patched = re.sub(r'compileSdk\s*(?:=)?\s*\d+', 'compileSdk 36', patched)
              if patched != source:
                  plugin_gradle.write_text(patched)
                  changed += 1
                  print(f'Patched Android plugin compileSdk compatibility: {plugin_gradle}')

          print(f'Android plugin Gradle files patched: {changed}')
          PY

      - name: Verify Shorebird configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SHOREBIRD_TOKEN"
          test -s shorebird.yaml
          shorebird account whoami --json >/tmp/shorebird-whoami.json

      - name: Prepare Preview Android package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android /tmp/express_preview_scaffold
          flutter create --platforms=android --org com.express.usuario --project-name preview /tmp/express_preview_scaffold
          cp -R /tmp/express_preview_scaffold/android ./android

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="preview"', 'android:label="Express Preview"')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />"""
          if marker in s:
              s = s.replace(marker, permissions, 1)
          p.write_text(s)
          PY

          python3 .github/scripts/prepare_android_branding.py "com.express.usuario.preview" "Express Preview"

          # Generate the Preview launcher from the same official Express logo.
          python3 .github/scripts/restore_branding_asset.py
          dart run flutter_launcher_icons

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_express.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M3,11l2,-5h14l2,5v7h-2a2,2 0,0 1,-4,0H9a2,2 0,0 1,-4,0H3v-7m4,-3 -1.2,3h12.4L17,8H7m0,5a1.5,1.5 0,1 0,0,3 1.5,1.5 0,0 0,0,-3m10,0a1.5,1.5 0,1 0,0,3 1.5,1.5 0,0 0,0,-3"/>
          </vector>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )
          s = s.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17",
          )
          s = s.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17",
          )
          s = s.replace(
              "jvmTarget = JavaVersion.VERSION_11.toString()",
              "jvmTarget = JavaVersion.VERSION_17.toString()",
          )
          if "minSdk = 23" not in s:
              replaced_min = False
              for old in (
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = flutter.minSdkVersion.toInt()",
              ):
                  if old in s:
                      s = s.replace(old, "minSdk = 23")
                      replaced_min = True
              if not replaced_min and "minSdk = 23" not in s:
                  if "defaultConfig {" not in s:
                      raise SystemExit("Could not enforce minSdk 23")
                  s = s.replace(
                      "defaultConfig {",
                      "defaultConfig {\n        minSdk = 23",
                      1,
                  )
          if "multiDexEnabled = true" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        multiDexEnabled = true",
                  1,
              )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY

      - name: Configure stable Android signing
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data '{"action":"signing"}')"

          printf '%s' "$RESPONSE" >/tmp/android-signing.json
          MODE="$(jq -r '.mode' /tmp/android-signing.json)"
          ALIAS="$(jq -r '.alias' /tmp/android-signing.json)"
          STORE_PASSWORD="$(jq -r '.store_password' /tmp/android-signing.json)"
          KEY_PASSWORD="$(jq -r '.key_password' /tmp/android-signing.json)"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          if [ "$MODE" != "existing" ]; then
            echo "El keystore Android estable todavía no existe."
            exit 1
          fi

          DOWNLOAD_URL="$(jq -r '.download_url' /tmp/android-signing.json)"
          curl -fsSL "$DOWNLOAD_URL" -o android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + s
          marker = "android {\n"
          preload = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              s = s.replace(marker, preload + marker, 1)
          signing = """    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String?
                  keyPassword = keystoreProperties["keyPassword"] as String?
                  storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                  storePassword = keystoreProperties["storePassword"] as String?
              }
          }

          """
          if 'create("release")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          p.write_text(s)
          PY

      - name: Disable R8 for Preview RTC validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          release_marker = 'getByName("release") {'
          if release_marker in s and 'isMinifyEnabled = false' not in s:
              s = s.replace(
                  release_marker,
                  release_marker + '\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  1,
              )
          elif 'release {' in s and 'isMinifyEnabled = false' not in s:
              s = s.replace(
                  'release {',
                  'release {\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  1,
              )
          p.write_text(s)
          PY

      - name: Shorebird base release
        if: steps.mode.outputs.mode == 'release'
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.EXPRESS_PREVIEW_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.EXPRESS_PREVIEW_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPRESS_PREVIEW_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.EXPRESS_PREVIEW_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.EXPRESS_PREVIEW_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          shorebird release android \
            --artifact apk \
            --target-platform android-arm64 \
            --target lib/preview_main.dart \
            --flutter-version 3.47.5 \
            --build-name "$PREVIEW_VERSION_NAME" \
            --build-number "$PREVIEW_BUILD_NUMBER" \
            -- \
            --no-pub \
            --dart-define="EXPRESS_FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="EXPRESS_FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            --dart-define="EXPRESS_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="EXPRESS_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="EXPRESS_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" \
            --dart-define="EXPRESS_GOOGLE_AUTH_ENABLED=true" \
            --dart-define="EXPRESS_FIREBASE_PACKAGE_NAME=com.express.usuario.preview"

      - name: Verify Preview notification icon
        if: steps.mode.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -p "$APK" resources.arsc | strings | grep -q 'ic_stat_express'

      - name: Shorebird patch
        if: steps.mode.outputs.mode == 'patch'
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.EXPRESS_PREVIEW_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.EXPRESS_PREVIEW_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPRESS_PREVIEW_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.EXPRESS_PREVIEW_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.EXPRESS_PREVIEW_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          shorebird patch \
            --platforms=android \
            --allow-asset-diffs \
            --target lib/preview_main.dart \
            --release-version "$PREVIEW_RELEASE_VERSION" \
            --build-name="$PREVIEW_VERSION_NAME" \
            --build-number="$PREVIEW_BUILD_NUMBER" \
            --dart-define="EXPRESS_FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="EXPRESS_FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            --dart-define="EXPRESS_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="EXPRESS_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="EXPRESS_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" \
            --dart-define="EXPRESS_GOOGLE_AUTH_ENABLED=true" \
            --dart-define="EXPRESS_FIREBASE_PACKAGE_NAME=com.express.usuario.preview"

      - name: Register published Preview patch in release gate
        if: steps.mode.outputs.mode == 'patch'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" \
            | jq -r .value)"

          BODY="$(jq -nc \
            --arg action preview_patch_published \
            --arg commit_sha "$GITHUB_SHA" \
            --arg version_name "$PREVIEW_VERSION_NAME" \
            --argjson build_number "$PREVIEW_BUILD_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{action:$action,commit_sha:$commit_sha,version_name:$version_name,build_number:$build_number,run_id:$run_id}')"

          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"

          test "$(echo "$RESPONSE" | jq -r '.ok // false')" = "true"
          test "$(echo "$RESPONSE" | jq -r '.preview_commit_sha // empty')" = "$GITHUB_SHA"

          {
            echo "## Preview patch identity"
            echo
            echo "- Version: **$PREVIEW_RELEASE_VERSION**"
            echo "- Patch SHA: **$GITHUB_SHA**"
            echo "- Release gate: **updated**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patchable Preview APK
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: express-preview-shorebird
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish patchable Preview APK as GitHub Release
        if: steps.mode.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs -type f -name '*.apk' | head -n 1)"
          TAG="preview-shorebird-v${PREVIEW_VERSION_NAME}-build${PREVIEW_BUILD_NUMBER}"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          jq -nc \
            --arg version_name "$PREVIEW_VERSION_NAME" \
            --argjson build_number "$PREVIEW_BUILD_NUMBER" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{version_name:$version_name,build_number:$build_number,commit_sha:$commit_sha,apk_sha256:$apk_sha256,workflow_run_id:$workflow_run_id}' \
            > preview-build-identity.json

          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" preview-build-identity.json \
            --title "Express Preview Shorebird v${PREVIEW_VERSION_NAME} · build ${PREVIEW_BUILD_NUMBER}" \
            --notes "APK Preview con Shorebird Code Push. La identidad autoritativa está en preview-build-identity.json. Package: com.express.usuario.preview. Preview no publica AAB."

      - name: Register published Preview base in release gate
        if: steps.mode.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" \
            | jq -r .value)"

          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/preview-shorebird-v${PREVIEW_VERSION_NAME}-build${PREVIEW_BUILD_NUMBER}/app-release.apk"
          BODY="$(jq -nc \
            --arg action preview_base_published \
            --arg commit_sha "$GITHUB_SHA" \
            --arg version_name "$PREVIEW_VERSION_NAME" \
            --argjson build_number "$PREVIEW_BUILD_NUMBER" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg apk_url "$APK_URL" \
            '{action:$action,commit_sha:$commit_sha,version_name:$version_name,build_number:$build_number,run_id:$run_id,apk_url:$apk_url}')"

          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"

          test "$(echo "$RESPONSE" | jq -r '.ok // false')" = "true"
          test "$(echo "$RESPONSE" | jq -r '.version_name // empty')" = "$PREVIEW_VERSION_NAME"
          test "$(echo "$RESPONSE" | jq -r '.build_number // empty')" = "$PREVIEW_BUILD_NUMBER"
          test "$(echo "$RESPONSE" | jq -r '.preview_base_commit_sha // empty')" = "$GITHUB_SHA"
          test "$(echo "$RESPONSE" | jq -r '.preview_commit_sha // empty')" = "$GITHUB_SHA"
          test -n "$(echo "$RESPONSE" | jq -r '.preview_build_id // empty')"

          {
            echo "## Preview base identity"
            echo
            echo "- Version: **$PREVIEW_RELEASE_VERSION**"
            echo "- Base SHA: **$GITHUB_SHA**"
            echo "- APK: **$APK_URL**"
            echo "- Release gate: **updated before workflow completion**"
          } >> "$GITHUB_STEP_SUMMARY"


  recover-preview:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[recover-preview]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery marker
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve recovery identity
        shell: bash
        run: |
          set -euo pipefail
          MARKER=".github/recovery/preview-release-recovery.json"
          test -s "$MARKER"
          TARGET_SHA="$(jq -r '.target_sha // empty' "$MARKER")"
          VERSION_NAME="$(jq -r '.version_name // empty' "$MARKER")"
          BUILD_NUMBER="$(jq -r '.build_number // empty' "$MARKER")"
          SOURCE_RUN_ID="$(jq -r '.source_run_id // empty' "$MARKER")"
          test "$TARGET_SHA" != ""
          test "$VERSION_NAME" != ""
          test "$BUILD_NUMBER" != ""
          test "$SOURCE_RUN_ID" != ""
          TAG="preview-shorebird-v${VERSION_NAME}-build${BUILD_NUMBER}"
          {
            echo "RECOVERY_TARGET_SHA=$TARGET_SHA"
            echo "RECOVERY_VERSION_NAME=$VERSION_NAME"
            echo "RECOVERY_BUILD_NUMBER=$BUILD_NUMBER"
            echo "RECOVERY_SOURCE_RUN_ID=$SOURCE_RUN_ID"
            echo "RECOVERY_TAG=$TAG"
          } >> "$GITHUB_ENV"

      - name: Download already-built Shorebird APK
        uses: actions/download-artifact@v4
        with:
          name: express-preview-shorebird
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RECOVERY_SOURCE_RUN_ID }}

      - name: Verify recovered APK and identity manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find dist -type f -name 'app-release.apk' | head -n 1)"
          test -s "$APK"
          unzip -p "$APK" resources.arsc | strings | grep -q 'ic_stat_express'
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          jq -nc \
            --arg version_name "$RECOVERY_VERSION_NAME" \
            --argjson build_number "$RECOVERY_BUILD_NUMBER" \
            --arg commit_sha "$RECOVERY_TARGET_SHA" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg workflow_run_id "$RECOVERY_SOURCE_RUN_ID" \
            '{version_name:$version_name,build_number:$build_number,commit_sha:$commit_sha,apk_sha256:$apk_sha256,workflow_run_id:$workflow_run_id}' \
            > preview-build-identity.json
          echo "RECOVERY_APK=$APK" >> "$GITHUB_ENV"
          echo "RECOVERY_APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

      - name: Publish or refresh recovered GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RECOVERY_TAG" "$RECOVERY_APK" preview-build-identity.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RECOVERY_TAG" "$RECOVERY_APK" preview-build-identity.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "Express Preview Shorebird v${RECOVERY_VERSION_NAME} · build ${RECOVERY_BUILD_NUMBER}" \
              --notes "APK Preview recuperado desde el run Shorebird ${RECOVERY_SOURCE_RUN_ID}. La identidad autoritativa está en preview-build-identity.json. Preview no publica AAB."
          fi

      - name: Verify recovered release artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/recovered-release
          mkdir -p /tmp/recovered-release
          gh release download "$RECOVERY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "app-release.apk" \
            --pattern "preview-build-identity.json" \
            --dir /tmp/recovered-release
          IDENTITY=/tmp/recovered-release/preview-build-identity.json
          APK=/tmp/recovered-release/app-release.apk
          test "$(jq -r '.commit_sha // empty' "$IDENTITY")" = "$RECOVERY_TARGET_SHA"
          test "$(jq -r '.version_name // empty' "$IDENTITY")" = "$RECOVERY_VERSION_NAME"
          test "$(jq -r '.build_number // empty' "$IDENTITY")" = "$RECOVERY_BUILD_NUMBER"
          EXPECTED="$(jq -r '.apk_sha256 // empty' "$IDENTITY")"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Register exact recovered Preview base in release gate
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" \
            | jq -r .value)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RECOVERY_TAG/app-release.apk"
          BODY="$(jq -nc \
            --arg action preview_base_published \
            --arg commit_sha "$RECOVERY_TARGET_SHA" \
            --arg version_name "$RECOVERY_VERSION_NAME" \
            --argjson build_number "$RECOVERY_BUILD_NUMBER" \
            --arg run_id "$RECOVERY_SOURCE_RUN_ID" \
            --arg apk_url "$APK_URL" \
            '{action:$action,commit_sha:$commit_sha,version_name:$version_name,build_number:$build_number,run_id:$run_id,apk_url:$apk_url}')"
          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESPONSE" | jq .
          test "$(echo "$RESPONSE" | jq -r '.ok // false')" = "true"
          test "$(echo "$RESPONSE" | jq -r '.preview_base_commit_sha // empty')" = "$RECOVERY_TARGET_SHA"
          test "$(echo "$RESPONSE" | jq -r '.preview_commit_sha // empty')" = "$RECOVERY_TARGET_SHA"

      - name: Trigger QA for recovered Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run express-qa.yml --repo "$GITHUB_REPOSITORY"
