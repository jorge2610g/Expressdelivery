name: Express Single App - Web First QA

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/express-single-app-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'web/**'
      - '.github/workflows/express-single-app-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: express-single-app-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-web:
    name: Shared Flutter checks and production-format Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Guard unified application release contract
        run: python3 .github/scripts/check_single_app_contract.py
      - name: Restore official Express branding
        run: python3 .github/scripts/restore_branding_asset.py
      - name: Verify official Express push branding and centered passenger titles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('lib/video_style_home.dart').read_text()
          native = Path('lib/push_notifications_native.dart').read_text()
          prepare = Path('.github/scripts/prepare_android_branding.py').read_text()
          web = Path('web/express_push_sw.js').read_text()
          assert screen.count("'Elige tu viaje'") == 2
          assert "'¿A dónde vas?',\n                textAlign: TextAlign.center" in screen
          assert "largeIcon: const DrawableResourceAndroidBitmap(" in native
          assert "ic_express_notification_large" in prepare
          assert "ic_stat_express" in prepare
          assert '/assets/assets/branding/express_app_icon.png' in web
          assert 'icons/Icon-192.png' not in web
          print("PASS: Express push logos and both passenger headings")
          PY

      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Web and the same Android entrypoint
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/web_preview.dart \
            lib/mobile_main.dart \
            lib/auth_entry.dart \
            lib/connected_shell.dart \
            lib/connected_experience.dart \
            lib/video_style_home.dart \
            lib/services/express_service.dart
      - name: Analyze all of lib/ (fails on any error, catches broken imports)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib
      - name: Flutter regression suite
        run: flutter test
      - name: Build current Web application
        run: |
          flutter build web --release \
            --target lib/web_preview.dart \
            --base-href / \
            --dart-define="EXPRESS_PACKAGE_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
      - name: Confirm Web artifact
        run: |
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
