name: Recover Preview 1.6.0+153 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-preview-153.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

env:
  WORKER_URL: https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/android-build-worker
  TARGET_SHA: b0093637d363ed3e19b38fc5ab206502bb79976e
  SOURCE_RUN_ID: '37413043227'
  VERSION_NAME: '1.6.0'
  BUILD_NUMBER: '153'
  TAG: preview-shorebird-v1.6.0-build153

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Preview source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Download already-built Shorebird APK
        uses: actions/download-artifact@v4
        with:
          name: express-preview-shorebird
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify recovered APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find dist -type f -name 'app-release.apk' | head -n 1)"
          test -s "$APK"
          unzip -p "$APK" resources.arsc | strings | grep -q 'ic_stat_express'
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

      - name: Build immutable Preview identity manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          jq -nc \
            --arg version_name "$VERSION_NAME" \
            --argjson build_number "$BUILD_NUMBER" \
            --arg commit_sha "$TARGET_SHA" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg workflow_run_id "$SOURCE_RUN_ID" \
            '{version_name:$version_name,build_number:$build_number,commit_sha:$commit_sha,apk_sha256:$apk_sha256,workflow_run_id:$workflow_run_id}' \
            > preview-build-identity.json
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

      - name: Publish recovered GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" preview-build-identity.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" preview-build-identity.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "Express Preview Shorebird v1.6.0 · build 153" \
              --notes "APK Preview recuperado del run Shorebird 37413043227. La identidad autoritativa está en preview-build-identity.json. Preview no publica AAB."
          fi

      - name: Verify release artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/recovered-release
          mkdir -p /tmp/recovered-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "app-release.apk" \
            --pattern "preview-build-identity.json" \
            --dir /tmp/recovered-release
          test "$(jq -r '.commit_sha // empty' /tmp/recovered-release/preview-build-identity.json)" = "$TARGET_SHA"
          test "$(jq -r '.version_name // empty' /tmp/recovered-release/preview-build-identity.json)" = "$VERSION_NAME"
          test "$(jq -r '.build_number // empty' /tmp/recovered-release/preview-build-identity.json)" = "$BUILD_NUMBER"
          EXPECTED="$(jq -r '.apk_sha256 // empty' /tmp/recovered-release/preview-build-identity.json)"
          ACTUAL="$(sha256sum /tmp/recovered-release/app-release.apk | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Register exact Preview base in release gate
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" \
            | jq -r .value)"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-release.apk"
          BODY="$(jq -nc \
            --arg action preview_base_published \
            --arg commit_sha "$TARGET_SHA" \
            --arg version_name "$VERSION_NAME" \
            --argjson build_number "$BUILD_NUMBER" \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg apk_url "$APK_URL" \
            '{action:$action,commit_sha:$commit_sha,version_name:$version_name,build_number:$build_number,run_id:$run_id,apk_url:$apk_url}')"
          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESPONSE" | jq .
          test "$(echo "$RESPONSE" | jq -r '.ok // false')" = "true"
          test "$(echo "$RESPONSE" | jq -r '.preview_base_commit_sha // empty')" = "$TARGET_SHA"
          test "$(echo "$RESPONSE" | jq -r '.preview_commit_sha // empty')" = "$TARGET_SHA"


      - name: Trigger QA on recovered Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run express-qa.yml --repo "$GITHUB_REPOSITORY"
