name: Build Express Android
# One official flow: build signed APK+AAB, attach the GitHub Release, then upload
# the AAB to Play internal only when the paired candidate is explicitly approved.
# Push QA requires an exact pre-approved job ID and source SHA; no queue draining.
# Signed APK/AAB are immutable and tied to the authorized source SHA/job.
# Production Play promotion is not part of this workflow.
# Prefer running the temporary app on both Mac AVDs before dispatch. If the owner
# explicitly chooses manual QA from Play Internal, the pair may still be uploaded
# to Internal while device QA remains pending; this workflow never promotes to Production.
on:
  # The assistant can submit a one-file signed QA request via GitHub writes.
  push:
    branches:
      - main
      - work/express-unified-android-build141
    paths:
      - '.github/build-requests/android-internal.json'
      - '.github/build-requests/android-141.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Build job UUID approved by owner; must match the selected source commit'
        required: true
        type: string
      confirm_emulator_qa:
        description: "Type QA EMULADORES OK only after testing both Mac AVDs, or QA PENDIENTE - PRUEBA MANUAL EN INTERNAL when the owner will test from Play Internal. The latter does not certify device QA."
        required: true
        type: string
      confirm_candidate:
        description: 'After emulator QA passes or the owner chooses manual QA in Internal, type AUTORIZO APK+AAB PRUEBAS INTERNAS to create the signed pair and upload its AAB to Play Internal.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: express-android-builder
  cancel-in-progress: false

env:
  SUPABASE_URL: https://zgpijrznvaskgcmauwxx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_MALGs-X8KdmJSq-QQzeazQ_p5xsfrZP
  WORKER_URL: https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/android-build-worker

jobs:
  build:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.confirm_emulator_qa == 'QA EMULADORES OK' || inputs.confirm_emulator_qa == 'QA PENDIENTE - PRUEBA MANUAL EN INTERNAL') && inputs.confirm_candidate == 'AUTORIZO APK+AAB PRUEBAS INTERNAS' && inputs.job_id != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '197861476') || (github.event_name == 'push' && github.ref == 'refs/heads/work/express-unified-android-build141') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Express
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claim queued build
        id: claim
        shell: bash
        env:
          REQUESTED_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/work/express-unified-android-build141" ]; then
            REQUEST_FILE=".github/build-requests/android-141.json"
            test -s "$REQUEST_FILE"
            REQUESTED_JOB_ID="$(jq -er '.job_id' "$REQUEST_FILE")"
            REQUESTED_SOURCE_SHA="$(jq -er '.source_sha' "$REQUEST_FILE")"
            test "$(jq -er '.version_name' "$REQUEST_FILE")" = "1.6.3"
            test "$(jq -er '.build_number' "$REQUEST_FILE")" = "141"
            [[ "$REQUESTED_JOB_ID" =~ ^[0-9a-f-]{36}$ ]]
            [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$REQUESTED_SOURCE_SHA" "$GITHUB_SHA"
            if ! git diff --quiet "$REQUESTED_SOURCE_SHA" "$GITHUB_SHA" -- lib assets android_overlay pubspec.yaml pubspec.lock .github/scripts .github/workflows/build-android.yml; then
              echo "::error::Solicitud 141 cambió fuentes móviles respecto del SHA autorizado."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            REQUEST_FILE=".github/build-requests/android-internal.json"
            test -s "$REQUEST_FILE"
            REQUESTED_JOB_ID="$(jq -r '.job_id // empty' "$REQUEST_FILE")"
            REQUESTED_VERSION_NAME="$(jq -r '.version_name // empty' "$REQUEST_FILE")"
            REQUESTED_BUILD_NUMBER="$(jq -r '.build_number // empty' "$REQUEST_FILE")"
            if [ -z "$REQUESTED_JOB_ID" ]; then
              [[ "$REQUESTED_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              [[ "$REQUESTED_BUILD_NUMBER" =~ ^[0-9]+$ ]]
              SOURCE_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
              test "$SOURCE_VERSION" = "${REQUESTED_VERSION_NAME}+${REQUESTED_BUILD_NUMBER}"
            else
              [[ "$REQUESTED_JOB_ID" =~ ^[0-9a-f-]{36}$ ]]
            fi
          fi
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ -z "${REQUESTED_JOB_ID:-}" ]; then
            QUEUE_BODY="$(jq -nc \
              --arg action queue_internal_candidate \
              --arg version_name "$REQUESTED_VERSION_NAME" \
              --arg build_number "$REQUESTED_BUILD_NUMBER" \
              --arg commit_sha "$GITHUB_SHA" \
              --arg changelog "Express 1.6.4 · unificación de entornos por cuenta; QA completo en Pruebas internas." \
              '{action:$action,version_name:$version_name,build_number:($build_number|tonumber),commit_sha:$commit_sha,changelog:$changelog}')"
            QUEUE_RESPONSE="$(curl -sS -X POST "$WORKER_URL" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$QUEUE_BODY")"
            echo "$QUEUE_RESPONSE"
            REQUESTED_JOB_ID="$(echo "$QUEUE_RESPONSE" | jq -r '.job.id // empty')"
            if [ -z "$REQUESTED_JOB_ID" ]; then
              echo "::error::No se creó la candidata interna solicitada por el propietario."
              exit 1
            fi
          fi
          BODY="$(jq -nc \
            --arg action claim \
            --arg job_id "${REQUESTED_JOB_ID:-}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg source_sha "${REQUESTED_SOURCE_SHA:-}" \
            '{action:$action,job_id:$job_id,run_id:$run_id,commit_sha:$commit_sha,source_sha:$source_sha}')"
          RESPONSE="$(curl -sS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESPONSE"
          JOB_ID="$(echo "$RESPONSE" | jq -r '.job.id // empty')"
          if [ -z "$JOB_ID" ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            JOB_ARTIFACT="$(echo "$RESPONSE" | jq -r '.job.artifact_type')"
            if [ "$JOB_ARTIFACT" != "single-app-candidate-apk+aab" ]; then
              echo "::error::La única publicación interna autorizada aquí es la pareja oficial APK+AAB del mismo job y SHA."
              exit 1
            fi
          fi
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "version_name=$(echo "$RESPONSE" | jq -r '.job.version_name')" >> "$GITHUB_OUTPUT"
          echo "build_number=$(echo "$RESPONSE" | jq -r '.job.build_number')" >> "$GITHUB_OUTPUT"
          echo "artifact_type=$(echo "$RESPONSE" | jq -r '.job.artifact_type')" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(echo "$RESPONSE" | jq -r '.job.commit_sha // empty')" >> "$GITHUB_OUTPUT"

      - name: Record manual Internal QA as pending
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.confirm_emulator_qa == 'QA PENDIENTE - PRUEBA MANUAL EN INTERNAL')
        shell: bash
        run: |
          {
            echo '### Android device QA'
            echo 'Status: pending. Manual verification from Google Play Internal is still required.'
            echo 'This is not an emulator QA pass and does not authorize Production promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::notice::Device QA remains pending; this run is limited to the official APK+AAB and Google Play Internal.'

      - name: Checkout exact build source
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.claim.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify build source identity
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          PACKAGE_VERSION_NAME="${PACKAGE_VERSION%%+*}"
          PACKAGE_BUILD_NUMBER="${PACKAGE_VERSION##*+}"
          REQUESTED_VERSION_NAME="${{ steps.claim.outputs.version_name }}"
          REQUESTED_BUILD_NUMBER="${{ steps.claim.outputs.build_number }}"
          ARTIFACT_TYPE="${{ steps.claim.outputs.artifact_type }}"
          case "$ARTIFACT_TYPE" in
            single-app-candidate-apk+aab|candidate-apk+aab|apk+aab|aab) ;;
            *) echo "::error::Solo compilar artefactos Android firmados autorizados com.express.usuario1."; exit 1 ;;
          esac
          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$PACKAGE_VERSION_NAME" != "$REQUESTED_VERSION_NAME" ]; then
            echo "::error::Build bloqueado: versión fuente $PACKAGE_VERSION_NAME no coincide con $REQUESTED_VERSION_NAME."
            exit 1
          fi

          if [ "$PACKAGE_BUILD_NUMBER" != "$REQUESTED_BUILD_NUMBER" ]; then
            echo "::error::Build bloqueado: número fuente $PACKAGE_BUILD_NUMBER no coincide con $REQUESTED_BUILD_NUMBER."
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "${{ steps.claim.outputs.source_sha }}" ]; then
            echo "::error::Build bloqueado: checkout $ACTUAL_SHA no coincide con SHA solicitado ${{ steps.claim.outputs.source_sha }}."
            exit 1
          fi

          echo "Source identity verified: source=$PACKAGE_VERSION, artifact=$ARTIFACT_TYPE, requested_build=$REQUESTED_BUILD_NUMBER, sha=$ACTUAL_SHA"

      - name: Guard Production traceability against current mobile source
        if: steps.claim.outputs.has_job == 'true' && (steps.claim.outputs.artifact_type == 'candidate-apk+aab' || steps.claim.outputs.artifact_type == 'single-app-candidate-apk+aab' || steps.claim.outputs.artifact_type == 'apk+aab' || steps.claim.outputs.artifact_type == 'aab')
        shell: bash
        run: |
