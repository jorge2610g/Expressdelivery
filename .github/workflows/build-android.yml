name: Build Express Android

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      job_id:
        description: Optional build_jobs UUID to compile
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: express-android-builder
  cancel-in-progress: false

env:
  SUPABASE_URL: https://zgpijrznvaskgcmauwxx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_MALGs-X8KdmJSq-QQzeazQ_p5xsfrZP
  WORKER_URL: https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/android-build-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Express
        uses: actions/checkout@v5

      - name: Claim queued build
        id: claim
        shell: bash
        env:
          REQUESTED_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action claim \
            --arg job_id "${REQUESTED_JOB_ID:-}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            '{action:$action,job_id:$job_id,run_id:$run_id,commit_sha:$commit_sha}')"
          RESPONSE="$(curl -sS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESPONSE"
          JOB_ID="$(echo "$RESPONSE" | jq -r '.job.id // empty')"
          if [ -z "$JOB_ID" ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "version_name=$(echo "$RESPONSE" | jq -r '.job.version_name')" >> "$GITHUB_OUTPUT"
          echo "build_number=$(echo "$RESPONSE" | jq -r '.job.build_number')" >> "$GITHUB_OUTPUT"

      - name: No queued build
        if: steps.claim.outputs.has_job != 'true'
        run: echo "No hay builds Android en cola."

      - name: Setup Flutter
        if: steps.claim.outputs.has_job == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        if: steps.claim.outputs.has_job == 'true'
        run: flutter pub get

      - name: Create Android platform scaffold
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/express_android_scaffold
          flutter create --platforms=android --org com.express --project-name usuario1 /tmp/express_android_scaffold
          rm -rf android
          cp -R /tmp/express_android_scaffold/android ./android
          sed -i 's/android:label="usuario1"/android:label="Express"/g' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />"""
          if marker in s:
              s = s.replace(marker, permissions, 1)
          p.write_text(s)
          PY

      - name: Configure Android signing
        if: steps.claim.outputs.has_job == 'true'
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + s
          marker = "android {\n"
          preload = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              s = s.replace(marker, preload + marker, 1)
          signing = """    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String?
                  keyPassword = keystoreProperties["keyPassword"] as String?
                  storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                  storePassword = keystoreProperties["storePassword"] as String?
              }
          }

          """
          if 'create("release")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          p.write_text(s)
          PY
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "No hay keystore de producción; se usará firma de prueba del runner."
            echo "mode=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.claim.outputs.has_job == 'true'
        run: >-
          flutter build apk --release
          --target lib/mobile_main.dart
          --build-name "${{ steps.claim.outputs.version_name }}"
          --build-number "${{ steps.claim.outputs.build_number }}"

      - name: Build release AAB
        if: steps.claim.outputs.has_job == 'true'
        run: >-
          flutter build appbundle --release
          --target lib/mobile_main.dart
          --build-name "${{ steps.claim.outputs.version_name }}"
          --build-number "${{ steps.claim.outputs.build_number }}"

      - name: Prepare public release names
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.claim.outputs.version_name }}"
          BUILD="${{ steps.claim.outputs.build_number }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/express-v${VERSION}-build${BUILD}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/express-v${VERSION}-build${BUILD}.aab"

      - name: Upload GitHub artifacts
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: express-v${{ steps.claim.outputs.version_name }}-build${{ steps.claim.outputs.build_number }}
          path: dist/*
          retention-days: 30

      - name: Request signed Supabase upload URLs
        if: steps.claim.outputs.has_job == 'true'
        id: uploadmeta
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          RESPONSE="$(curl -sS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg action upload_urls --arg job_id "${{ steps.claim.outputs.job_id }}" '{action:$action,job_id:$job_id}')")"
          echo "$RESPONSE" > /tmp/upload-meta.json
          echo "$RESPONSE"
          echo "apk_path=$(echo "$RESPONSE" | jq -r '.apk.path')" >> "$GITHUB_OUTPUT"
          echo "aab_path=$(echo "$RESPONSE" | jq -r '.aab.path')" >> "$GITHUB_OUTPUT"

      - name: Upload APK and AAB to Supabase Storage
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-upload && cd /tmp/release-upload
          npm init -y >/dev/null 2>&1
          npm install @supabase/supabase-js@2 >/dev/null 2>&1
          cat > upload.mjs <<'JS'
          import { createClient } from '@supabase/supabase-js';
          import { readFile } from 'node:fs/promises';
          const meta = JSON.parse(await readFile("/tmp/upload-meta.json", "utf8"));
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_PUBLISHABLE_KEY);
          const version = process.env.RELEASE_VERSION;
          const build = process.env.RELEASE_BUILD;
          const files = [
            { kind: "apk", file: process.env.GITHUB_WORKSPACE + "/dist/express-v" + version + "-build" + build + ".apk", type: "application/vnd.android.package-archive" },
            { kind: "aab", file: process.env.GITHUB_WORKSPACE + "/dist/express-v" + version + "-build" + build + ".aab", type: "application/octet-stream" },
          ];
          for (const item of files) {
            const bytes = await readFile(item.file);
            const target = meta[item.kind];
            const { error } = await supabase.storage
              .from(meta.bucket)
              .uploadToSignedUrl(target.path, target.token, bytes, { contentType: item.type });
            if (error) throw error;
            console.log("Uploaded", item.kind, target.path);
          }
          JS
          RELEASE_VERSION="${{ steps.claim.outputs.version_name }}" \
          RELEASE_BUILD="${{ steps.claim.outputs.build_number }}" \
          node upload.mjs

      - name: Mark build ready
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action complete \
            --arg job_id "${{ steps.claim.outputs.job_id }}" \
            --arg apk_path "${{ steps.uploadmeta.outputs.apk_path }}" \
            --arg aab_path "${{ steps.uploadmeta.outputs.aab_path }}" \
            --arg signing_mode "${{ steps.signing.outputs.mode }}" \
            '{action:$action,job_id:$job_id,apk_path:$apk_path,aab_path:$aab_path,signing_mode:$signing_mode}')"
          curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY"

      - name: Mark build failed
        if: failure() && steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set +e
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action fail \
            --arg job_id "${{ steps.claim.outputs.job_id }}" \
            --arg error_message "GitHub Actions falló. Revisa el run $GITHUB_RUN_ID para ver los logs." \
            '{action:$action,job_id:$job_id,error_message:$error_message}')"
          curl -sS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true
