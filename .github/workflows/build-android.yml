name: Build Express Android
# A push to this workflow also wakes the queued Android builder.
# Wake correct source-version candidate 3c2d3399-984b-4720-9b10-e253247260ae; manual identity worldwide, signed QA only.
# Wake signed manual-only Express QA candidate job 8e118782-3362-4354-8b92-58884fba2198; Play Store remains unchanged.
# Wake signed Bolivia individual KYC QA APK candidate a912e14f-a803-4184-8168-e8cbb6dacc9a; no Play publish.
# Wake authorized Bolivia KYC QA candidate job 0be894f3-2274-4f5d-b59e-3bb3b274f0a1; signed APK/AAB only, no Play publication.
# The Android queue is driven by Supabase. Building a signed QA candidate does
# not change Google Play's published versionCode or grant release approval.
# Manual wake trigger: final signed Express 1.6.1 build 138 (Play baseline 137),
# queue 2a2665c6-c730-45ad-9539-0f75dc2572cd, same build 138, for physical QA;
# Comment-only wake never advances Google Play or changes the signed app binary.
# CI wake for authorized rebuild job 916e7fb5-36c7-49df-9f9c-d82261c8ab63, source 9a1c6f8 (PR #119), signed QA 1.6.1+138.
# New QA wake 24bff9cd-584c-4980-a1a8-4b4607a4407b from merged KYC hotfix SHA 91a2d8e (PR #121), official package build 138.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Optional build_jobs UUID to compile
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: express-android-builder
  cancel-in-progress: false

env:
  SUPABASE_URL: https://zgpijrznvaskgcmauwxx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_MALGs-X8KdmJSq-QQzeazQ_p5xsfrZP
  WORKER_URL: https://zgpijrznvaskgcmauwxx.supabase.co/functions/v1/android-build-worker
  # Publishable client credentials only: Preview has no Production service key.
  EXPRESS_PREVIEW_SUPABASE_URL: https://xbphilqezmwfjfpdbwad.supabase.co
  EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Gj9wcPPgkBhypbL8xIx2-w_guLesRNY

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Express
        uses: actions/checkout@v5

      - name: Claim queued build
        id: claim
        shell: bash
        env:
          REQUESTED_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action claim \
            --arg job_id "${REQUESTED_JOB_ID:-}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            '{action:$action,job_id:$job_id,run_id:$run_id,commit_sha:$commit_sha}')"
          RESPONSE="$(curl -sS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESPONSE"
          JOB_ID="$(echo "$RESPONSE" | jq -r '.job.id // empty')"
          if [ -z "$JOB_ID" ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "version_name=$(echo "$RESPONSE" | jq -r '.job.version_name')" >> "$GITHUB_OUTPUT"
          echo "build_number=$(echo "$RESPONSE" | jq -r '.job.build_number')" >> "$GITHUB_OUTPUT"
          echo "artifact_type=$(echo "$RESPONSE" | jq -r '.job.artifact_type')" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(echo "$RESPONSE" | jq -r '.job.commit_sha // empty')" >> "$GITHUB_OUTPUT"

      - name: Checkout exact build source
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.claim.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify build source identity
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          PACKAGE_VERSION_NAME="${PACKAGE_VERSION%%+*}"
          PACKAGE_BUILD_NUMBER="${PACKAGE_VERSION##*+}"
          REQUESTED_VERSION_NAME="${{ steps.claim.outputs.version_name }}"
          REQUESTED_BUILD_NUMBER="${{ steps.claim.outputs.build_number }}"
          ARTIFACT_TYPE="${{ steps.claim.outputs.artifact_type }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$PACKAGE_VERSION_NAME" != "$REQUESTED_VERSION_NAME" ]; then
            echo "::error::Build bloqueado: versión fuente $PACKAGE_VERSION_NAME no coincide con $REQUESTED_VERSION_NAME."
            exit 1
          fi

          if [[ "$ARTIFACT_TYPE" == preview-* ]] && [ "$PACKAGE_BUILD_NUMBER" != "$REQUESTED_BUILD_NUMBER" ]; then
            echo "::error::Preview bloqueada: pubspec build $PACKAGE_BUILD_NUMBER no coincide con Preview $REQUESTED_BUILD_NUMBER."
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "${{ steps.claim.outputs.source_sha }}" ]; then
            echo "::error::Build bloqueado: checkout $ACTUAL_SHA no coincide con SHA solicitado ${{ steps.claim.outputs.source_sha }}."
            exit 1
          fi

          echo "Source identity verified: source=$PACKAGE_VERSION, artifact=$ARTIFACT_TYPE, requested_build=$REQUESTED_BUILD_NUMBER, sha=$ACTUAL_SHA"

      - name: Guard Production traceability against current mobile source
        if: steps.claim.outputs.has_job == 'true' && (steps.claim.outputs.artifact_type == 'candidate-apk+aab' || steps.claim.outputs.artifact_type == 'single-app-candidate-apk+aab' || steps.claim.outputs.artifact_type == 'apk+aab')
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ steps.claim.outputs.source_sha }}"
          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"

          SENSITIVE_DIFF="$(git diff --name-only "$SOURCE_SHA" "$MAIN_SHA" -- lib android assets pubspec.yaml pubspec.lock .github/scripts/prepare_android_branding.py || true)"
          if [ -n "$SENSITIVE_DIFF" ]; then
            echo "::error::Producción bloqueada: main contiene cambios móviles que no están en el SHA Preview/candidato."
            echo "$SENSITIVE_DIFF"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "lib/express_account_pages.dart": [
                  "final email = Supabase.instance.client.auth.currentUser?.email ?? '';",
                  "Versión ${info.version} (${info.buildNumber}) · $channel",
              ],
              "lib/map_provider.dart": [
                  "MAPBOX_PUBLIC_TOKEN",
                  "mapbox/streets-v12",
                  "class ExpressBaseTileLayer",
              ],
              "lib/passenger_ads_mobile.dart": [
                  "ADMOB_PASSENGER_BANNER_UNIT_ID",
                  "PassengerAdSlot",
              ],
              "lib/mobile_main.dart": ["runExpressMobile"],
          }
          missing = []
          for path, markers in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      missing.append(f"{path}: {marker}")
          if missing:
              raise SystemExit("Contrato de release incompleto; Producción bloqueada:\n- " + "\n- ".join(missing))
          print("Release contract verified: profile email/version + Mapbox + passenger ads + shared mobile entrypoint.")
          PY

          echo "Production traceability verified: source=$SOURCE_SHA current_mobile_main=$MAIN_SHA"
      - name: No queued build
        if: steps.claim.outputs.has_job != 'true'
        run: echo "No hay builds Android en cola."

      - name: Determine Android build mode
        if: steps.claim.outputs.has_job == 'true'
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          TYPE="${{ steps.claim.outputs.artifact_type }}"
          if [ "$TYPE" = "preview-apk" ] || [ "$TYPE" = "preview-apk+aab" ]; then
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            echo "target=lib/mobile_main.dart" >> "$GITHUB_OUTPUT"
            echo "project_name=preview" >> "$GITHUB_OUTPUT"
            echo "org=com.express.usuario" >> "$GITHUB_OUTPUT"
            echo "label=Express Preview" >> "$GITHUB_OUTPUT"
            echo "package_name=com.express.usuario.preview" >> "$GITHUB_OUTPUT"
            echo "file_prefix=express-preview" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=preview-android" >> "$GITHUB_OUTPUT"
            echo "release_title=Express Preview Android" >> "$GITHUB_OUTPUT"
          elif [ "$TYPE" = "single-app-candidate-apk+aab" ]; then
            # One production package and one native entrypoint; this is the actual
            # signed Play candidate to test before approval, not a Preview app.
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "candidate=true" >> "$GITHUB_OUTPUT"
            echo "target=lib/mobile_main.dart" >> "$GITHUB_OUTPUT"
            echo "project_name=usuario1" >> "$GITHUB_OUTPUT"
            echo "org=com.express" >> "$GITHUB_OUTPUT"
            echo "label=Express" >> "$GITHUB_OUTPUT"
            echo "package_name=com.express.usuario1" >> "$GITHUB_OUTPUT"
            echo "file_prefix=express-single-app-candidate" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=single-app-android-qa" >> "$GITHUB_OUTPUT"
            echo "release_title=Express Android QA sobre APK real de Producción" >> "$GITHUB_OUTPUT"
          elif [ "$TYPE" = "candidate-apk+aab" ]; then
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "candidate=true" >> "$GITHUB_OUTPUT"
            echo "target=lib/mobile_main.dart" >> "$GITHUB_OUTPUT"
            echo "project_name=usuario1" >> "$GITHUB_OUTPUT"
            echo "org=com.express" >> "$GITHUB_OUTPUT"
            echo "label=Express" >> "$GITHUB_OUTPUT"
            echo "package_name=com.express.usuario1" >> "$GITHUB_OUTPUT"
            echo "file_prefix=express-production-candidate" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=candidate-android" >> "$GITHUB_OUTPUT"
            echo "release_title=Express Production Candidate" >> "$GITHUB_OUTPUT"
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            echo "target=lib/mobile_main.dart" >> "$GITHUB_OUTPUT"
            echo "project_name=usuario1" >> "$GITHUB_OUTPUT"
            echo "org=com.express" >> "$GITHUB_OUTPUT"
            echo "label=Express" >> "$GITHUB_OUTPUT"
            echo "package_name=com.express.usuario1" >> "$GITHUB_OUTPUT"
            echo "file_prefix=express" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=android" >> "$GITHUB_OUTPUT"
            echo "release_title=Express Android" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify physical Supabase isolation before building
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.preview }}" = "true" ]; then
            if [ "$EXPRESS_PREVIEW_SUPABASE_URL" != "https://xbphilqezmwfjfpdbwad.supabase.co" ] \
               || [ "$EXPRESS_PREVIEW_SUPABASE_URL" = "$SUPABASE_URL" ] \
               || [ -z "$EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY" ] \
               || [ "$EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY" = "$SUPABASE_PUBLISHABLE_KEY" ]; then
              echo "::error::Preview must have its own Supabase project and publishable key."
              exit 1
            fi
            echo "Preview backend isolated; Preview push remains disabled."
          fi

      - name: Resolve Firebase Production Android config
        if: steps.claim.outputs.has_job == 'true' && steps.mode.outputs.preview != 'true'
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action firebase_config \
            --arg package_name "${{ steps.mode.outputs.package_name }}" \
            --arg display_name "${{ steps.mode.outputs.label }}" \
            '{action:$action,package_name:$package_name,display_name:$display_name}')"
          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")"

          FOUND="$(echo "$RESPONSE" | jq -r '.found // false')"
          API_KEY="$(echo "$RESPONSE" | jq -r '.api_key // empty')"
          APP_ID="$(echo "$RESPONSE" | jq -r '.app_id // empty')"
          SENDER_ID="$(echo "$RESPONSE" | jq -r '.messaging_sender_id // empty')"
          PROJECT_ID="$(echo "$RESPONSE" | jq -r '.project_id // empty')"
          STORAGE_BUCKET="$(echo "$RESPONSE" | jq -r '.storage_bucket // empty')"
          CREATED="$(echo "$RESPONSE" | jq -r '.created // false')"

          if [ "$FOUND" != "true" ] || [ -z "$API_KEY" ] || [ -z "$APP_ID" ] || [ -z "$SENDER_ID" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Firebase Android configuration could not be resolved for ${{ steps.mode.outputs.package_name }}."
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          echo "::add-mask::$APP_ID"
          echo "::add-mask::$SENDER_ID"
          echo "::add-mask::$PROJECT_ID"
          [ -z "$STORAGE_BUCKET" ] || echo "::add-mask::$STORAGE_BUCKET"

          {
            echo "BUILD_FIREBASE_API_KEY=$API_KEY"
            echo "BUILD_FIREBASE_APP_ID=$APP_ID"
            echo "BUILD_FIREBASE_MESSAGING_SENDER_ID=$SENDER_ID"
            echo "BUILD_FIREBASE_PROJECT_ID=$PROJECT_ID"
            echo "BUILD_FIREBASE_STORAGE_BUCKET=$STORAGE_BUCKET"
          } >> "$GITHUB_ENV"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "Firebase Android config ready for ${{ steps.mode.outputs.package_name }} (created=$CREATED)."
      - name: Resolve dedicated Firebase Preview Android config
        if: steps.claim.outputs.has_job == 'true' && steps.mode.outputs.preview == 'true'
        shell: bash
        env:
          PREVIEW_FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.EXPRESS_PREVIEW_FIREBASE_ANDROID_CONFIG_B64 }}
          PRODUCTION_FIREBASE_PROJECT_ID: ${{ vars.EXPRESS_PRODUCTION_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_FIREBASE_ANDROID_CONFIG_B64" ] || [ -z "$PRODUCTION_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Preview needs its own Firebase google-services.json (base64 secret) and Production Firebase project ID variable."
            exit 1
          fi
          printf '%s' "$PREVIEW_FIREBASE_ANDROID_CONFIG_B64" | base64 -d > /tmp/express-preview-google-services.json
          EXPECTED_PACKAGE="com.express.usuario.preview"
          PROJECT_ID="$(jq -r '.project_info.project_id // empty' /tmp/express-preview-google-services.json)"
          SENDER_ID="$(jq -r '.project_info.project_number // empty' /tmp/express-preview-google-services.json)"
          STORAGE_BUCKET="$(jq -r '.project_info.storage_bucket // empty' /tmp/express-preview-google-services.json)"
          API_KEY="$(jq -r --arg package "$EXPECTED_PACKAGE" '.client[] | select(.client_info.android_client_info.package_name == $package) | .api_key[0].current_key // empty' /tmp/express-preview-google-services.json | head -n 1)"
          APP_ID="$(jq -r --arg package "$EXPECTED_PACKAGE" '.client[] | select(.client_info.android_client_info.package_name == $package) | .client_info.mobilesdk_app_id // empty' /tmp/express-preview-google-services.json | head -n 1)"
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "$PRODUCTION_FIREBASE_PROJECT_ID" ] \
              || [ -z "$SENDER_ID" ] || [ -z "$API_KEY" ] || [ -z "$APP_ID" ]; then
            echo "::error::Firebase Preview missing or shared with Production; APK blocked."
            exit 1
          fi
          for value in "$API_KEY" "$APP_ID" "$SENDER_ID" "$PROJECT_ID" "$STORAGE_BUCKET"; do
            [ -z "$value" ] || echo "::add-mask::$value"
          done
          {
            echo "BUILD_FIREBASE_API_KEY=$API_KEY"
            echo "BUILD_FIREBASE_APP_ID=$APP_ID"
            echo "BUILD_FIREBASE_MESSAGING_SENDER_ID=$SENDER_ID"
            echo "BUILD_FIREBASE_PROJECT_ID=$PROJECT_ID"
            echo "BUILD_FIREBASE_STORAGE_BUCKET=$STORAGE_BUCKET"
          } >> "$GITHUB_ENV"
          echo "Firebase Preview isolated; native Preview push still disabled until separate dispatcher QA."

      - name: Setup Flutter
        if: steps.claim.outputs.has_job == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.claim.outputs.has_job == 'true'
        run: flutter pub get

      - name: Validate startup contract
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter --version | head -n 1 | grep -F 'Flutter 3.47.5'
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/mobile_main.dart \
            lib/preview_main.dart \
            lib/auth_entry.dart \
            lib/core/auth_redirect.dart \
            lib/core/express_supabase_bootstrap.dart
          flutter test --no-pub test/express_supabase_bootstrap_test.dart
          flutter test --no-pub test/auth_redirect_test.dart
      - name: Patch Android plugin Gradle compatibility
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = sorted(
              list(Path.home().glob('.pub-cache/hosted/pub.dev/*/android/build.gradle')) +
              list(Path.home().glob('.pub-cache/hosted/pub.dev/*/android/build.gradle.kts'))
          )
          if not matches:
              raise SystemExit('Android plugin Gradle files not found in pub cache')

          changed = 0
          for plugin_gradle in matches:
              source = plugin_gradle.read_text()
              patched = source.replace('jcenter()', 'mavenCentral()')
              if plugin_gradle.suffix == '.kts':
                  patched = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', patched)
                  patched = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', patched)
              else:
                  patched = re.sub(r'compileSdkVersion\s*(?:=)?\s*\d+', 'compileSdkVersion 36', patched)
                  patched = re.sub(r'compileSdk\s*(?:=)?\s*\d+', 'compileSdk 36', patched)
              if patched != source:
                  plugin_gradle.write_text(patched)
                  changed += 1
                  print(f'Patched Android plugin compileSdk compatibility: {plugin_gradle}')

          print(f'Android plugin Gradle files patched: {changed}')
          PY

      - name: Restore official Express icon
        if: steps.claim.outputs.has_job == 'true'
        run: python3 .github/scripts/restore_branding_asset.py

      - name: Create Android platform scaffold
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          rm -rf /tmp/express_android_scaffold
          flutter create --platforms=android --org "${{ steps.mode.outputs.org }}" --project-name "${{ steps.mode.outputs.project_name }}" /tmp/express_android_scaffold
          rm -rf android
          cp -R /tmp/express_android_scaffold/android ./android
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          project_name = "${{ steps.mode.outputs.project_name }}"
          label = "${{ steps.mode.outputs.label }}"
          s = s.replace(f'android:label="{project_name}"', f'android:label="{label}"')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />"""
          if marker in s:
              s = s.replace(marker, permissions, 1)
          p.write_text(s)
          PY

          python3 .github/scripts/prepare_android_branding.py \
            "${{ steps.mode.outputs.package_name }}" \
            "${{ steps.mode.outputs.label }}"

          # Generate every Android launcher density from the single official
          # Express logo restored from assets/branding/express_app_icon_512.b64.
          # Never download or substitute branding from another repository.
          python3 .github/scripts/restore_branding_asset.py
          dart run flutter_launcher_icons

          # Google Play requires API 36 for new apps/updates from 2026-08-31.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          replaced_compile = False
          replaced_target = False
          for old in (
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = flutter.compileSdkVersion.toInt()",
          ):
              if old in s:
                  s = s.replace(old, "compileSdk = 36")
                  replaced_compile = True
          for old in (
              "targetSdk = flutter.targetSdkVersion",
              "targetSdk = flutter.targetSdkVersion.toInt()",
          ):
              if old in s:
                  s = s.replace(old, "targetSdk = 36")
                  replaced_target = True
          if not replaced_compile and "compileSdk = 36" not in s:
              raise SystemExit("Could not enforce compileSdk 36")
          if not replaced_target and "targetSdk = 36" not in s:
              raise SystemExit("Could not enforce targetSdk 36")

          if "minSdk = 23" not in s:
              replaced_min = False
              for old in (
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = flutter.minSdkVersion.toInt()",
              ):
                  if old in s:
                      s = s.replace(old, "minSdk = 23")
                      replaced_min = True
              if not replaced_min and "minSdk = 23" not in s:
                  if "defaultConfig {" not in s:
                      raise SystemExit("Could not enforce minSdk 23")
                  s = s.replace(
                      "defaultConfig {",
                      "defaultConfig {\n        minSdk = 23",
                      1,
                  )

          # flutter_local_notifications requires Java core library desugaring.
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              marker = "compileOptions {"
              if marker not in s:
                  raise SystemExit("Could not find compileOptions block for desugaring")
              s = s.replace(
                  marker,
                  marker + "\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          p.write_text(s)
          PY

      - name: Regenerate and verify Android plugin registration
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT: android/ was just replaced by a fresh Flutter scaffold.
          # Re-run pub resolution AFTER that replacement so the Android plugin
          # registrant belongs to the actual scaffold that will be compiled.
          flutter pub get

          REGISTRANT="android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
          if [ ! -s "$REGISTRANT" ]; then
            echo "::error::Android plugin registrant was not regenerated after scaffold replacement."
            exit 1
          fi

          # These plugins sit on release-critical paths:
          # - shared_preferences: Supabase PKCE/session persistence
          # - url_launcher: OAuth browser launch
          # - package_info_plus: release/update diagnostics
          # - connectivity_plus: runtime connectivity checks
          for plugin in SharedPreferencesPlugin UrlLauncherPlugin PackageInfoPlugin ConnectivityPlugin GoogleMobileAdsPlugin; do
            if ! grep -Fq "$plugin" "$REGISTRANT"; then
              echo "::error::Critical Android plugin missing from GeneratedPluginRegistrant: $plugin"
              echo "Registrant contents:"
              sed -n '1,240p' "$REGISTRANT"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('.flutter-plugins-dependencies')
          if not p.exists():
              raise SystemExit('Missing .flutter-plugins-dependencies after scaffold regeneration')

          data = json.loads(p.read_text())
          android = {
              row.get('name')
              for row in data.get('plugins', {}).get('android', [])
              if isinstance(row, dict)
          }
          required = {
              'shared_preferences_android',
              'url_launcher_android',
              'package_info_plus',
              'connectivity_plus',
              'google_mobile_ads',
          }
          missing = sorted(required - android)
          if missing:
              raise SystemExit('Critical Android plugins missing from dependency graph: ' + ', '.join(missing))
          print('Android release-critical plugins verified:', ', '.join(sorted(required)))
          PY

      - name: Verify Google Play Android policy guard
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -q 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts

          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"

          # Express intentionally does not request restricted/background permissions.
          for permission in             ACCESS_BACKGROUND_LOCATION             MANAGE_EXTERNAL_STORAGE             REQUEST_INSTALL_PACKAGES             READ_SMS             SEND_SMS             RECEIVE_SMS             READ_PHONE_STATE             READ_CALL_LOG             WRITE_CALL_LOG             QUERY_ALL_PACKAGES; do
            if grep -q "$permission" "$MANIFEST"; then
              echo "Disallowed/unexpected Play permission found: $permission"
              exit 1
            fi
          done

          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"

      - name: Configure Android signing
        if: steps.claim.outputs.has_job == 'true'
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          RESPONSE="$(curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"action":"signing"}')"
          printf '%s' "$RESPONSE" > /tmp/android-signing.json

          MODE="$(jq -r '.mode' /tmp/android-signing.json)"
          ALIAS="$(jq -r '.alias' /tmp/android-signing.json)"
          STORE_PASSWORD="$(jq -r '.store_password' /tmp/android-signing.json)"
          KEY_PASSWORD="$(jq -r '.key_password' /tmp/android-signing.json)"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          if [ "$MODE" = "existing" ]; then
            DOWNLOAD_URL="$(jq -r '.download_url' /tmp/android-signing.json)"
            curl -fsSL "$DOWNLOAD_URL" -o android/app/upload-keystore.jks
          elif [ "$MODE" = "create" ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Express Delivery,O=Express Delivery"

            mkdir -p /tmp/signing-upload && cd /tmp/signing-upload
            npm init -y >/dev/null 2>&1
            npm install @supabase/supabase-js@2 >/dev/null 2>&1
            cat > upload-keystore.mjs <<'JS'
          import { createClient } from '@supabase/supabase-js';
          import { readFile } from 'node:fs/promises';

          const meta = JSON.parse(await readFile('/tmp/android-signing.json', 'utf8'));
          const bytes = await readFile(process.env.GITHUB_WORKSPACE + '/android/app/upload-keystore.jks');
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_PUBLISHABLE_KEY);
          const { error } = await supabase.storage
            .from('android-signing')
            .uploadToSignedUrl(meta.keystore_path, meta.upload_token, bytes, {
              contentType: 'application/octet-stream',
            });
          if (error) throw error;
          JS
            node upload-keystore.mjs
            cd "$GITHUB_WORKSPACE"
          else
            echo "No se pudo preparar la firma Android."
            exit 1
          fi

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$ALIAS" >/dev/null

          echo "Upload certificate SHA-256:"
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$ALIAS" \
            | grep -E 'SHA256:'

          # Export only the public certificate required by Google Play.
          keytool -export -rfc \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$ALIAS" \
            -file /tmp/upload_certificate.pem
          echo "BEGIN EXPRESS UPLOAD CERTIFICATE"
          cat /tmp/upload_certificate.pem
          echo "END EXPRESS UPLOAD CERTIFICATE"

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + s
          marker = "android {\n"
          preload = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              s = s.replace(marker, preload + marker, 1)
          signing = """    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String?
                  keyPassword = keystoreProperties["keyPassword"] as String?
                  storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                  storePassword = keystoreProperties["storePassword"] as String?
              }
          }

          """
          if 'create("release")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          p.write_text(s)
          PY

          echo "mode=production" >> "$GITHUB_OUTPUT"

      - name: Disable R8 for RTC compatibility
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Preview +158 is already validated without R8. Production must use
          # the same bytecode behavior: ZEGOCLOUD's flutter_callkit_incoming
          # and a transitive Apache Tika path reference optional classes that
          # R8 treats as fatal missing classes even though the non-minified
          # Android build is valid. Google Play does not require minification.
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          release_marker = 'getByName("release") {'
          if release_marker in s and 'isMinifyEnabled = false' not in s:
              s = s.replace(
                  release_marker,
                  release_marker + '\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  1,
              )
          elif 'release {' in s and 'isMinifyEnabled = false' not in s:
              s = s.replace(
                  'release {',
                  'release {\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  1,
              )
          p.write_text(s)
          PY

      - name: Validate Firebase Android build config
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VALUES=(
            "$BUILD_FIREBASE_API_KEY"
            "$BUILD_FIREBASE_APP_ID"
            "$BUILD_FIREBASE_MESSAGING_SENDER_ID"
            "$BUILD_FIREBASE_PROJECT_ID"
          )
          for value in "${VALUES[@]}"; do
            if [ -z "$value" ]; then
              echo "::error::Firebase Android configuration is incomplete. Build blocked."
              exit 1
            fi
          done
          echo "Firebase Android configuration is complete."
      - name: Validate AdMob production config
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_PASSENGER_BANNER_UNIT_ID: ${{ secrets.ADMOB_PASSENGER_BANNER_UNIT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.preview }}" = "true" ]; then
            echo "Preview usa IDs oficiales de prueba de Google Mobile Ads."
            exit 0
          fi

          APP_ID="${ADMOB_ANDROID_APP_ID:-}"
          BANNER_ID="${ADMOB_PASSENGER_BANNER_UNIT_ID:-}"

          if { [ -n "$APP_ID" ] && [ -z "$BANNER_ID" ]; } || { [ -z "$APP_ID" ] && [ -n "$BANNER_ID" ]; }; then
            echo "::error::AdMob incompleto: configura juntos ADMOB_ANDROID_APP_ID y ADMOB_PASSENGER_BANNER_UNIT_ID."
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "AdMob Producción sin credenciales reales: los anuncios permanecen inactivos."
            exit 0
          fi

          if ! [[ "$APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]; then
            echo "::error::ADMOB_ANDROID_APP_ID no tiene formato válido de App ID de AdMob."
            exit 1
          fi
          if ! [[ "$BANNER_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
            echo "::error::ADMOB_PASSENGER_BANNER_UNIT_ID no tiene formato válido de Banner Ad Unit ID."
            exit 1
          fi
          echo "AdMob Producción: App ID y Banner ID presentes y con formato válido."
      - name: Build release APK
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        env:
          GOOGLE_AUTH_ENABLED: ${{ vars.EXPRESS_GOOGLE_AUTH_ENABLED }}
        run: |
          set -euo pipefail
          FIREBASE_API_KEY="$BUILD_FIREBASE_API_KEY"
          FIREBASE_APP_ID="$BUILD_FIREBASE_APP_ID"
          FIREBASE_MESSAGING_SENDER_ID="$BUILD_FIREBASE_MESSAGING_SENDER_ID"
          FIREBASE_PROJECT_ID="$BUILD_FIREBASE_PROJECT_ID"
          FIREBASE_STORAGE_BUCKET="$BUILD_FIREBASE_STORAGE_BUCKET"

          flutter build apk --release             --target "${{ steps.mode.outputs.target }}"             --build-name "${{ steps.claim.outputs.version_name }}"             --build-number "${{ steps.claim.outputs.build_number }}"             --dart-define="EXPRESS_FIREBASE_API_KEY=$FIREBASE_API_KEY"             --dart-define="EXPRESS_FIREBASE_APP_ID=$FIREBASE_APP_ID"             --dart-define="EXPRESS_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"             --dart-define="EXPRESS_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"             --dart-define="EXPRESS_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"             --dart-define="EXPRESS_GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-true}"             --dart-define="EXPRESS_FIREBASE_PACKAGE_NAME=${{ steps.mode.outputs.package_name }}"             --dart-define="EXPRESS_PREVIEW_MODE=${{ steps.mode.outputs.preview }}" --dart-define="EXPRESS_PREVIEW_SUPABASE_URL=$EXPRESS_PREVIEW_SUPABASE_URL" --dart-define="EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY=$EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY" --dart-define="EXPRESS_PREVIEW_PUSH_ENABLED=false" \
            --dart-define="MAPBOX_PUBLIC_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }}" \
            --dart-define="ADMOB_PASSENGER_BANNER_UNIT_ID=${{ secrets.ADMOB_PASSENGER_BANNER_UNIT_ID }}"

      - name: Build release AAB
        if: steps.claim.outputs.has_job == 'true' && steps.mode.outputs.preview != 'true'
        shell: bash
        env:
          GOOGLE_AUTH_ENABLED: ${{ vars.EXPRESS_GOOGLE_AUTH_ENABLED }}
        run: |
          set -euo pipefail
          FIREBASE_API_KEY="$BUILD_FIREBASE_API_KEY"
          FIREBASE_APP_ID="$BUILD_FIREBASE_APP_ID"
          FIREBASE_MESSAGING_SENDER_ID="$BUILD_FIREBASE_MESSAGING_SENDER_ID"
          FIREBASE_PROJECT_ID="$BUILD_FIREBASE_PROJECT_ID"
          FIREBASE_STORAGE_BUCKET="$BUILD_FIREBASE_STORAGE_BUCKET"

          flutter build appbundle --release             --target "${{ steps.mode.outputs.target }}"             --build-name "${{ steps.claim.outputs.version_name }}"             --build-number "${{ steps.claim.outputs.build_number }}"             --dart-define="EXPRESS_FIREBASE_API_KEY=$FIREBASE_API_KEY"             --dart-define="EXPRESS_FIREBASE_APP_ID=$FIREBASE_APP_ID"             --dart-define="EXPRESS_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"             --dart-define="EXPRESS_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"             --dart-define="EXPRESS_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"             --dart-define="EXPRESS_GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-true}"             --dart-define="EXPRESS_FIREBASE_PACKAGE_NAME=${{ steps.mode.outputs.package_name }}"             --dart-define="EXPRESS_PREVIEW_MODE=${{ steps.mode.outputs.preview }}" --dart-define="EXPRESS_PREVIEW_SUPABASE_URL=$EXPRESS_PREVIEW_SUPABASE_URL" --dart-define="EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY=$EXPRESS_PREVIEW_SUPABASE_PUBLISHABLE_KEY" --dart-define="EXPRESS_PREVIEW_PUSH_ENABLED=false" \
            --dart-define="MAPBOX_PUBLIC_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }}" \
            --dart-define="ADMOB_PASSENGER_BANNER_UNIT_ID=${{ secrets.ADMOB_PASSENGER_BANNER_UNIT_ID }}"

      - name: Verify built Android identity
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          EXPECTED_PACKAGE="${{ steps.mode.outputs.package_name }}"
          EXPECTED_VERSION="${{ steps.claim.outputs.version_name }}"
          EXPECTED_BUILD="${{ steps.claim.outputs.build_number }}"

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "::error::No se encontró aapt para verificar el APK."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "name='$EXPECTED_PACKAGE'" || {
            echo "::error::APK incorrecto: package esperado $EXPECTED_PACKAGE."
            exit 1
          }
          echo "$BADGING" | grep -Fq "versionCode='$EXPECTED_BUILD'" || {
            echo "::error::APK incorrecto: build/versionCode esperado $EXPECTED_BUILD."
            exit 1
          }
          echo "$BADGING" | grep -Fq "versionName='$EXPECTED_VERSION'" || {
            echo "::error::APK incorrecto: versionName esperado $EXPECTED_VERSION."
            exit 1
          }
          echo "Built APK identity verified: $EXPECTED_PACKAGE v$EXPECTED_VERSION build $EXPECTED_BUILD."

      - name: Verify Android notification icon
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          # Never pipe an archive's output into grep -q under pipefail:
          # grep exits early on a match, making unzip/strings fail with SIGPIPE.
          # Inspect resource identities without suppressing actionable errors.
          python3 - <<'PY'
          import subprocess
          import zipfile
          from pathlib import Path

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          mode_is_preview = "${{ steps.mode.outputs.preview }}" == "true"

          aapt = subprocess.run(
              ['bash', '-c', 'find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1'],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          if not aapt:
              raise SystemExit('No se encontró aapt para verificar íconos en APK')

          resource_check = subprocess.run(
              [aapt, 'dump', 'resources', str(apk)],
              capture_output=True, text=True, check=True,
          )
          resource_table = resource_check.stdout
          # Android's AAPT2 may rename/optimize resource *file paths* in an
          # APK (e.g. res/abc.png). The compiled drawable symbol, not the
          # ZIP filename, is the stable Android resource identifier.
          for icon in ('ic_stat_express', 'ic_express_notification_large'):
              if f':drawable/{icon}' not in resource_table:
                  print('Icon resource missing from APK:', icon)
                  print('Existing Express icons:', [
                      line.strip()[:220] for line in resource_table.splitlines()
                      if 'ic_stat_' in line or 'ic_express_notification' in line
                  ][:25])
                  raise SystemExit('APK sin ícono oficial de notificación: ' + icon)
              print('APK compiled drawable OK:', icon)

          # Confirm the build received the *original* SHA-verified logo and
          # that the APK has an actual packaged Android resource table.
          # Never demand a literal filename inside optimized APK ZIP entries.
          official_png = Path('assets/branding/express_app_icon.png').read_bytes()
          large_png = Path(
              'android/app/src/main/res/drawable-nodpi/'
              'ic_express_notification_large.png'
          ).read_bytes()
          if not official_png.startswith(bytes.fromhex('89504e470d0a1a0a')):
              raise SystemExit('Ícono oficial Express no es un PNG válido')
          if large_png != official_png:
              raise SystemExit('Ícono de notificación difiere del logo oficial Express')
          with zipfile.ZipFile(apk) as archive:
              if 'resources.arsc' not in archive.namelist():
                  raise SystemExit('APK sin tabla Android de recursos compilados')
          print('APK: logo PNG oficial preservado y recursos empaquetados')

          if not mode_is_preview:
              if not aab.is_file() or aab.stat().st_size == 0:
                  raise SystemExit('AAB firmado no generado')
              with zipfile.ZipFile(aab) as archive:
                  if 'base/resources.pb' not in archive.namelist():
                      raise SystemExit('AAB sin tabla de recursos base')
                  resources_proto = archive.read('base/resources.pb')
                  # AAB keeps stable resource *names* in resources.pb;
                  # file paths are not guaranteed to retain source names.
                  for icon in ('ic_stat_express', 'ic_express_notification_large'):
                      if icon.encode('utf-8') not in resources_proto:
                          raise SystemExit('AAB sin recurso de notificación: ' + icon)
                      print('AAB compiled drawable OK:', icon)
          PY

      - name: Prepare public release names
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.claim.outputs.version_name }}"
          BUILD="${{ steps.claim.outputs.build_number }}"
          PREFIX="${{ steps.mode.outputs.file_prefix }}"
          mkdir -p dist
          APK="dist/${PREFIX}-v${VERSION}-build${BUILD}.apk"
          AAB="dist/${PREFIX}-v${VERSION}-build${BUILD}.aab"
          IDENTITY="dist/${PREFIX}-v${VERSION}-build${BUILD}-identity.json"

          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          if [ "${{ steps.mode.outputs.preview }}" != "true" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "$AAB"
          fi

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          AAB_SHA256=""
          if [ -s "$AAB" ]; then
            AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"

          jq -n \
            --arg artifact_type "${{ steps.claim.outputs.artifact_type }}" \
            --arg version_name "$VERSION" \
            --arg build_number "$BUILD" \
            --arg package_name "${{ steps.mode.outputs.package_name }}" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree_sha "$SOURCE_TREE_SHA" \
            --arg main_sha_at_build "$MAIN_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg aab_sha256 "$AAB_SHA256" \
            '{
              artifact_type:$artifact_type,
              version_name:$version_name,
              build_number:($build_number|tonumber),
              package_name:$package_name,
              source_sha:$source_sha,
              source_tree_sha:$source_tree_sha,
              main_sha_at_build:$main_sha_at_build,
              workflow_run_id:$workflow_run_id,
              apk_sha256:$apk_sha256,
              aab_sha256:$aab_sha256
            }' > "$IDENTITY"

      - name: Upload GitHub artifacts
        if: steps.claim.outputs.has_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.file_prefix }}-v${{ steps.claim.outputs.version_name }}-build${{ steps.claim.outputs.build_number }}
          path: dist/*
          retention-days: 30

      - name: Publish APK and AAB as GitHub Release
        if: steps.claim.outputs.has_job == 'true'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.claim.outputs.version_name }}"
          BUILD="${{ steps.claim.outputs.build_number }}"
          PREFIX="${{ steps.mode.outputs.file_prefix }}"
          TAG="${{ steps.mode.outputs.tag_prefix }}-v${VERSION}-build${BUILD}"
          SOURCE_SHA="${{ steps.claim.outputs.source_sha }}"
          JOB_ID="${{ steps.claim.outputs.job_id }}"
          # Multiple QA candidates can share Google Play versionCode until an
          # explicitly approved release is promoted. Keep immutable URLs/hashes.
          if [ "${{ steps.claim.outputs.artifact_type }}" = "single-app-candidate-apk+aab" ]; then
            TAG="${TAG}-sha${SOURCE_SHA:0:12}-job${JOB_ID%%-*}"
          fi
          TITLE="${{ steps.mode.outputs.release_title }} v${VERSION} · build ${BUILD}"

          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          if [ "${{ steps.mode.outputs.preview }}" = "true" ]; then
            gh release create "$TAG" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}.apk" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}-identity.json" \
              --target "${{ steps.claim.outputs.source_sha }}" \
              --title "$TITLE" \
              --notes "Build Preview APK generado automáticamente desde Express."
          elif [ "${{ steps.mode.outputs.candidate }}" = "true" ]; then
            gh release create "$TAG" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}.apk" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}.aab" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}-identity.json" \
              --target "${{ steps.claim.outputs.source_sha }}" \
              --title "$TITLE" \
              --notes "APK y AAB reales de Express (mismo paquete/firma). Candidato unificado: NO publicar en Play hasta pruebas Android + aprobación manual del mismo SHA y hashes."
          else
            gh release create "$TAG" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}.apk" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}.aab" \
              "dist/${PREFIX}-v${VERSION}-build${BUILD}-identity.json" \
              --target "${{ steps.claim.outputs.source_sha }}" \
              --title "$TITLE" \
              --notes "Build de producción APK + AAB promovido sin cambiar código funcional."
          fi

          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${PREFIX}-v${VERSION}-build${BUILD}.apk"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.mode.outputs.preview }}" = "true" ]; then
            echo "aab_url=" >> "$GITHUB_OUTPUT"
          else
            AAB_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${PREFIX}-v${VERSION}-build${BUILD}.aab"
            echo "aab_url=$AAB_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark build ready
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.claim.outputs.version_name }}"
          BUILD="${{ steps.claim.outputs.build_number }}"
          PREFIX="${{ steps.mode.outputs.file_prefix }}"
          APK="dist/${PREFIX}-v${VERSION}-build${BUILD}.apk"
          AAB="dist/${PREFIX}-v${VERSION}-build${BUILD}.aab"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          AAB_SHA256=""
          if [ -s "$AAB" ]; then
            AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          fi
          IDENTITY="dist/${PREFIX}-v${VERSION}-build${BUILD}-identity.json"
          IDENTITY_SHA256="$(sha256sum "$IDENTITY" | awk '{print $1}')"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git rev-parse HEAD^{tree})"

          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action complete \
            --arg job_id "${{ steps.claim.outputs.job_id }}" \
            --arg apk_url "${{ steps.release.outputs.apk_url }}" \
            --arg aab_url "${{ steps.release.outputs.aab_url }}" \
            --arg signing_mode "${{ steps.signing.outputs.mode }}" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg aab_sha256 "$AAB_SHA256" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree_sha "$SOURCE_TREE_SHA" \
            --arg identity_manifest_sha256 "$IDENTITY_SHA256" \
            '{action:$action,job_id:$job_id,apk_url:$apk_url,aab_url:$aab_url,signing_mode:$signing_mode,apk_sha256:$apk_sha256,aab_sha256:$aab_sha256,source_sha:$source_sha,source_tree_sha:$source_tree_sha,identity_manifest_sha256:$identity_manifest_sha256}')"
          curl -fsS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY"

      - name: Mark build failed
        if: failure() && steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set +e
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=supabase-android-build-worker" | jq -r .value)"
          BODY="$(jq -nc \
            --arg action fail \
            --arg job_id "${{ steps.claim.outputs.job_id }}" \
            --arg error_message "GitHub Actions falló. Revisa el run $GITHUB_RUN_ID para ver los logs." \
            '{action:$action,job_id:$job_id,error_message:$error_message}')"
          curl -sS -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true
